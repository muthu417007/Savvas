<template>
 <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
   <div class="slds-modal__container custom-modal__container">
     <header class="slds-modal__header custom-modal__header">
     <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
     <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
     <span class="slds-assistive-text">Close</span>
     </button>
     <h2 class="slds-text-heading_medium">Email Cart</h2>
</header>

<div class="slds-modal__content slds-p-around_medium custom-modal__content">
<div class="slds-m-bottom_small">
   <label class="slds-form-element__label" for="emailAddresses">Email(s)*</label>
<div>Separate multiple email addresses with commas</div>
<lightning-input id="emailAddresses" label=" " placeholder="Enter email addresses" 
value={emailAddresses} onchange={handleEmailChange} type="email" pattern="[A-Za-z0-9._-]+@[a-z0-9-]+\.[a-z]{2,}$" message-when-pattern-mismatch="Please enter a valid email" required></lightning-input>
</div>
</div>
<footer class="slds-modal__footer custom-modal__footer">
<lightning-button variant="brand" label="Email Cart" onclick={handleEmailSend}></lightning-button>
<lightning-button variant="neutral" label="Cancel" onclick={closeModal}></lightning-button>
</footer>
</div>
 </section>
<div class="slds-backdrop slds-backdrop_open"></div> 
</template>
