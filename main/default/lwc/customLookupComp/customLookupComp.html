<template>
    <div>
        <div class="slds-form-element">
            <div class="slds-form-element__control">
                <div class="slds-combobox_container">
                    <div id="box" class={boxClass} aria-expanded="true" aria-haspopup="listbox" role="combobox">
                        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
							 <template if:true={isValueSelected}>
							 <label class="slds-form-element__label" for="combobox-id-1">{label}</label>
                                <div id="lookup-pill" class="slds-pill_container">
                                    <lightning-pill class="pillSize" label={selectedName} name={selectedName} onremove={handleRemovePill} href={href}>
                                        <lightning-icon icon-name={iconName} alternative-text="acc" ></lightning-icon>
                                    </lightning-pill>
                                </div>
							</template>	
								<!--<div class="pillDiv slds-hide">      
								  {selectedName}  
								  <span class="slds-icon_container slds-combobox__input-entity-icon">
									<lightning-icon icon-name={iconName} size="x-small" alternative-text="icon"></lightning-icon>  
								  </span>
								  <input type="text"
										 id="combobox-id-1"
										 value={selectedName}       
										 class="slds-input slds-combobox__input slds-combobox__input-value"
										 readonly
									/>
								  <button class="slds-button slds-button_icon slds-input__icon slds-input__icon_right" title="Remove selected option">
									<lightning-icon icon-name="utility:close" size="x-small" alternative-text="close icon" onclick={handleRemove}></lightning-icon> 
								 </button>
							   </div> 	-->					
							  <template if:false={isValueSelected}>
                                <div class="slds-p-top_none">
                                    <lightning-input 
										class={inputClass}
										type="search"
										id="input"
										value={searchTerm}
										onclick={handleClick} 
										onchange={onChange}
										label={label}
										oncommit={handleCommit}
                                        required={requiredFlag}
										message-when-value-missing='Complete this field'
										onblur={handleBlur}
										placeholder={placeholder}>
									</lightning-input>
                                </div>
							</template>	
                        </div>
						<template if:false={outsideClick}>
                        <div id="listbox-id-1" class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" role="listbox">
							<ul class="slds-listbox slds-listbox_vertical" role="presentation">
								<template for:each={records} for:item="record">
									<li key={record.Id} onclick={onSelect} data-id={record.Id} role="presentation" data-name={record.Name}>
										<span class="slds-lookup__item-action slds-lookup__item-action--label" role="option">
											<lightning-icon class="slds-icon slds-icon--small slds-icon-text-default" icon-name={iconName} alternative-text={objName} size="small"></lightning-icon>
											<template if:true={isAccount}>
												<span class="slds-truncate">{record.Account_Name_City_State__c}</span>
											</template>	
											<template if:true={isContact}>
												<span class="slds-truncate">{record.Name}, {record.Account.Name}</span>
											</template>	
										</span>
									</li>
								</template>
							</ul>
					   </div>
					</template>
					<template if:false={hasRecords}>
						<ul  style="text-align: left; color: red;">{noFoundMessage}</ul>
					</template>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
