                </thead>
                <tbody>
                    <template if:true={orderLineRecords}>
                        <template for:each={orderLineRecords} for:item='line'>
                            <tr key={line.index}>
                                <td>{line.SalesItem}</td>
                                <td>{line.Material}</td>
                                <td>{line.ItemDescription}</td>
                                <td>{line.NetValueInDocumentCurrency}</td>
                                <td>{line.MaterialPricingGroupDescription}</td>
                                <td>0.00</td>
                                <td>{line.OrderQuantity}</td>
                                <td>
                                <a onclick={handleShipDetails}>
                                    Shipped &nbsp;{line.QtyClosed}
                                </a>
                                </td>
                                <td>{line.TobeShipped}</td>
                                <td>{line.Status}</td>
                                <td>{line.updatedStatusDate}</td>
                            </tr>
                        </template>
                    </template> 
                </tbody>
                </table>
            </lightning-tab>
            <lightning-tab label="Shipment">
                <div style="background-color: #F2F3F5;width:100%;margin-top:20px;">
                    <span style="padding-bottom: 5px;">&nbsp;&nbsp;<i class="arrow down"></i></span><span
                        style="font-size: 12px;">&nbsp;&nbsp;Shipping Information</span>
                </div>
            </lightning-tab>
            <lightning-tab label="Bill To">
                <div style="background-color: #F2F3F5;width:100%;margin-top:20px;">
                    <span style="padding-bottom: 5px;">&nbsp;&nbsp;<i class="arrow down"></i></span><span
                        style="font-size: 12px;">&nbsp;&nbsp;Address Information</span>
                </div>
            </lightning-tab>
        </lightning-tabset>
    </div>
</template>
</template>
<template if:true={showDeliveryDetails}>
    <div class="slds-grid" style="font-size: 12px;">
        <div class="slds-col slds-size_10-of-12" style="float: left;font-size: 16px;">
            <span>{labels.scc_home_Order_Status} ></span><span>{labels.scc_OrderStatus_Order_Search}</span><span style="font-weight:bold"> > Order Detail</span>
        </div>
        <div class="slds-size_2-of-12" style="float:right;">
            <button style="font-size: 12px;background-color:blue;color:white;" onclick={closeShowDeliveryDetails} >Close</button>
        </div>
    </div>
    <c-scc_delivery-info-l-w-c get-deliverydata={deliveryInfo}></c-scc_delivery-info-l-w-c>
</template>
</template>
