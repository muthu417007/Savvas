<template>        
   <template if:true={openModal}>  
     <div class="slds-modal slds-fade-in-open slds-backdrop" role="dialog">  
       <div class="slds-modal__container">  
         <!------HEADER Section-->  
          <div class="slds-modal__header">  
            <button class="slds-modal__close siop-modal-close-btn" onclick={closeModal} onfocusout={focusOutClose} aria-label="close">x</button>
						<h3 aria-level="2">SIOP Registration</h3>            
          </div>  
         <!------Body Section-->  
          <div class="slds-modal__content slds-p-around_medium" >  
             <div class="slds-form_horizontal" >
                 <template if:true= {showerrormsg}>              
                   <p class="errormsg siop-error-msg" role="alert">{errormessage} </p>
                 </template>
                 <template if:true= {showErrorMessage}>
                    <p class="errormsg siop-error-msg-helpMsg" role="alert" >{errorMessageHelpContact}</p>
                 </template>
                 <div class="slds-col slds-size_3-of-3 slds-m-top_medium"> 
                    <div class="slds-form-element__label">Zip / Postal Code *</div>              
                    <div class="slds-form-element slds-p-around_none">
                        <div class="slds-form-element__control slds-p-around_none">
                            <input type="text" aria-label="Zip / Postal Code Required" placeholder="Zip Code" value={Zipcode} onchange={handleZipcodeChange} onkeyup={handleZipcodeChange} class="slds-input fixed-width-input zipcode-input" data-index="0"/>
                        </div>
                    </div>
                </div>
                <div class="slds-col slds-size_3-of-3"> 
                    <div class="slds-form-element__label">Order # *</div>              
                    <div class="slds-form-element slds-p-around_none">
                        <div class="slds-form-element__control slds-p-around_none">
                            <input type="text" aria-label="Order # Required" placeholder="Order #" value={ordernum} onchange={handleorderChange} onkeyup={handleorderChange} class="slds-input fixed-width-input" data-index="0"/>
                        </div>
                    </div>
                </div>                
             </div>
          </div>
         <!------Footer Section-->  
         <div class="slds-modal__footer">  
          <button class="slds-button siop-modal-button" onclick={verifyUsrInp} aria-disabled={isGoDisabled} onfocusout={focusOutButton}>Go</button>          
         </div>  
       </div>  
     </div>  
   </template>  
</template>
