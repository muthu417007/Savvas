<template>
    <div class="spinner-wrapper slds-spinner_container" if:true={isLoading1}>
        <div class="slds-backdrop slds-backdrop_open">
            <lightning-spinner size="medium" variant="brand" alternative-text="Loading"></lightning-spinner>
        </div>
    </div>
    <template if:false={showDeliveryDetails}>
        <div
            class="slds-grid slds-wrap slds-grid_vertical slds-gutters slds-p-around_large order-status-BG slds-is-relative">
            <h1 class="slds-assistive-text">Documents</h1>
            <template if:false={orderDetailsSect}>
                <template if:false={isGuest}>
                    <template if:false={isInternal}>
                        <div class="slds-col">
                            <nav role="navigation" aria-label="Breadcrumbs">
                                <ol class="slds-breadcrumb slds-list_horizontal slds-wrap">
                                    <li class="slds-breadcrumb__item">
                                        <a href="#"
                                            class="slds-m-right_small breadcrumb-label first-breadcrumb">Home</a>
                                    </li>
                                    <li class="slds-breadcrumb__item">
                                        <a href="#" class="slds-m-horizontal_small breadcrumb-label">Documents</a>
                                    </li>
                                    <template if:true={confirmAddress}>
                                        <li class="slds-breadcrumb__item">
                                            <a class="slds-m-left_small slds-text-title_bold breadcrumb-label">Confirm
                                                Addresses</a>
                                        </li>
                                    </template>
                                    <template if:false={confirmAddress}>
                                        <li class="slds-breadcrumb__item">
                                            <a href="#" class="slds-m-horizontal_small breadcrumb-label">Confirm
                                                Addresses</a>
                                        </li>
                                        <li class="slds-breadcrumb__item">
                                            <a class="slds-m-left_small slds-text-title_bold breadcrumb-label">Document
                                                Search</a>
                                        </li>
                                    </template>
                                </ol>
                            </nav>
                        </div>
                    </template>
                </template>
                <template if:true={confirmAddress}>
                    <template if:true={showMultiAddressPage}>
                        <div class="slds-col slds-size_3-of-3">
                            <div class="slds-m-top_large slds-p-top_large confirm-address-cards">
                                <h2
                                    class="slds-p-horizontal_x-large slds-float_left slds-is-relative confirm-address-title">
                                    Select Billing Address</span></h2>
                                <div
                                    class="slds-p-right_large slds-m-bottom_medium slds-float_right confirm-address-filter">
                                    <label class="slds-form-element__label slds-p-right_none slds-m-left_x-small" for="filter-search-input">Filter Results<span class="slds-assistive-text">Filter by name or zip / Postal Code. Showing {totalBillToRecords} of {totalBillToRecords} Items</span></label>
                                    <div class="slds-is-relative slds-show_inline-block slds-m-left_xx-small">
                                        <div
                                            class="slds-show_inline-block info-icon slds-m-right_xx-small slds-text-align_center">
                                            i</div>
                                        <div class="slds-popover slds-popover_tooltip slds-nubbin_bottom"
                                            role="tooltip">
                                            <div class="slds-popover__body">Filter by name or zip / Postal Code</div>
                                        </div>
                                    </div>
                                    <div class="slds-is-relative">
                                        <input type="text" id="filter-search-input" class="filter-search-input" value={searchTerm} onchange={handleUserInputs} onkeyup={handleUserInputs} />
                                        <a href="#" class="slds-button filter-clear" onclick={clearFilterInputBill}
                                            aria-label="close" role="button">x</a>
                                    </div>
                                    <div class="slds-form-element__label item-count" role="alert">{totalBillToRecords}
                                        of {totalBillToRecords} Items</div>
                                    <div class="slds-is-relative slds-show_inline-block">
                                    </div>
                                </div>
                                <div
                                    class="slds-grid slds-wrap slds-gutters_x-small slds-p-vertical_medium slds-p-left_x-large slds-p-right_small card-container">
                                    <template for:each={filteredresult} for:item="sAddress">
                                        <div class="slds-col slds-size_3-of-12" key={sAddress.AccId}>
                                            <div
                                                class="slds-visual-picker slds-visual-picker_medium slds-m-bottom_small">
                                                <input type="radio" id={sAddress.AccId} value={sAddress.AccId} name="BillingAddresss"   onclick={handleRowClick}     data-record-id={sAddress.AccId}   />
                                                <label for={sAddress.AccId}>
                                                        <div class="card-size"      onclick={handleRowClick}     data-record-id={sAddress.AccId}  >
                                                            <span class="slds-visual-picker__figure slds-visual-picker__text card-size slds-p-around_medium card-padding">
                                                                <span>
                                                                    <p>{sAddress.name} {sAddress.AccountName}</p>
                                                                    {sAddress.BillinStreet}<br/>
                                                                    {sAddress.BillingCity} {sAddress.State}{sAddress.ZipCode}<br/>
                                                                    {sAddress.BillingCountry}
                                                                </span>
                                                            </span>
                                                            <span class="slds-icon_container slds-visual-picker__text-check">
                                                                <svg class="slds-icon slds-icon-text-check slds-icon_x-small" aria-hidden="true"></svg>
                                                            </span>
                                                        </div>
                                                    </label>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                        <div class="slds-col slds-size_3-of-3">
                            <div class="slds-m-top_large slds-p-top_large confirm-address-cards">
                                <h2
                                    class="slds-p-horizontal_x-large slds-float_left slds-is-relative confirm-address-title">
                                    Select Shipping Address (Optional)</h2>
                                <div
                                    class="slds-p-right_large slds-m-bottom_medium slds-float_right confirm-address-filter">
                                    <label class="slds-form-element__label slds-p-right_none slds-m-left_x-small" for="filter-search-input1">Filter Results<span class="slds-assistive-text">Filter by name or zip / Postal Code. Showing {totalShipToRecords} of {totalShipToRecords} Items</span></label>
                                    <div class="slds-is-relative slds-show_inline-block slds-m-left_xx-small">
                                        <div
                                            class="slds-show_inline-block info-icon slds-m-right_xx-small slds-text-align_center">
                                            i</div>
                                        <div class="slds-popover slds-popover_tooltip slds-nubbin_bottom"
                                            role="tooltip">
                                            <div class="slds-popover__body">Filter by name or zip / Postal Code</div>
                                        </div>
                                    </div>
                                    <div class="slds-is-relative">
                                        <input type="text" id="filter-search-input1" class="filter-search-input" value={searchTermShip} onchange={handleUserInputsShip} onkeyup={handleUserInputsShip} />
                                        <a href="#" class="slds-button filter-clear" onclick={clearFilterInputShip}
                                            aria-label="close" role="button">x</a>
                                    </div>
                                    <div class="slds-form-element__label item-count" role="alert">{totalShipToRecords}
                                        of {totalShipToRecords} Items</div>
                                    <div class="slds-is-relative slds-show_inline-block">
                                    </div>
                                </div>
                                <div class="slds-p-horizontal_x-large allow-drop-ship">
                                    <lightning-input type="checkbox"
                                        label="Return documents for any associated Shipping Address" checked={isChecked}
                                        onchange={handlecheckboxChange} id="allow-drop-ship"></lightning-input>
                                </div>
                                <div
                                    class="slds-grid slds-wrap slds-gutters_x-small slds-p-vertical_medium slds-p-left_x-large slds-p-right_small ship-address-container">
                                    <template for:each={filteredresultt} for:item="shippaddr">
                                        <div class="slds-col slds-size_3-of-12" key={shippaddr.AccShipId}>
                                            <div
                                                class="slds-visual-picker slds-visual-picker_medium slds-m-bottom_small">
                                                <input type="radio" id={shippaddr.AccShipId} value={shippaddr.AccShipId} name="shipping-address"
                                                        onclick={handleShipRowClick} data-record-id={shippaddr.AccShipId}/>
                                                <label for={shippaddr.AccShipId}>
                                                            <div class="card-size" >
                                                                <span class="slds-visual-picker__figure slds-visual-picker__text card-size slds-p-around_medium card-padding">
                                                                    <span style="text-align: left;">
                                                                        <p>{shippaddr.SAccountName}</p>
                                                                        {shippaddr.ShipStreet} <br />
                                                                        {shippaddr.ShippingCity} {shippaddr.Provionce} {shippaddr.PostalCode}<br/>
                                                                        {shippaddr.ShippingCountry}
                                                                    </span>
                                                                </span>
                                                                <span class="slds-icon_container slds-visual-picker__text-check">
                                                                    <svg class="slds-icon slds-icon-text-check slds-icon_x-small" aria-hidden="true"></svg>
                                                                </span>
                                                            </div>
                                                        </label>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                    <template if:true={showSingleAddressPage}>
                        <div class="slds-col slds-size_3-of-3">
                            <div class="slds-m-top_large slds-p-top_large confirm-address-cards">
                                <h2
                                    class="slds-p-horizontal_x-large slds-float_left slds-is-relative confirm-address-title">
                                    Review Addresses
                                </h2>
                                <div
                                    class="slds-p-right_large slds-m-bottom_medium slds-float_right confirm-address-filter">
                                    <button class="search-pdts-button" onclick={returnProductDetailpageOnclick}>Search for Documents</button>
                                </div>
                                <div class="slds-grid slds-wrap slds-gutters slds-p-bottom_x-large slds-p-left_x-large slds-p-right_small review-address-container"

                                    <div class="slds-col slds-size_5-of-12">
                                        <div class="slds-grid slds-wrap slds-gutters">
                                            <div class="slds-col slds-size_4-of-12">
                                                <p class="address-label">Billing Account</p>
                                            </div>
                                            <div class="slds-col slds-size_8-of-12 slds-m-bottom_small">
                                                <p class="address-value">{selectedBilling.BillToNumber}<br>{selectedBilling.AccountName}
                                                </p>
                                            </div>
                                            <div class="slds-col slds-size_4-of-12">
                                                <p class="address-label">Billing Address</p>
                                            </div>
                                            <div class="slds-col slds-size_8-of-12 slds-m-bottom_small">
                                                <p class="address-value">
                                                    {selectedBilling.BillinStreet}<br>{selectedBilling.BillingCity} {selectedBilling.State}{selectedBilling.ZipCode}<br>{selectedBilling.BillingCountry}
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_6-of-12">
                                        <template if:false={showShipAddressEmptyPage}>
                                            <div class="slds-grid slds-wrap slds-gutters" key={Shipaddr.id}>
                                                <div class="slds-col slds-size_4-of-12">
                                                    <p class="address-label">Shipping Account</p>
                                                </div>
                                                <div class="slds-col slds-size_8-of-12 slds-m-bottom_small">
                                                    <p class="address-value">
                                                        {selectedShipping.ShipToNumber}<br>{selectedShipping.SAccountName}
                                                    </p>
                                                </div>
                                                <div class="slds-col slds-size_4-of-12">
                                                    <p class="address-label">Shipping Address</p>
                                                </div>
                                                <div class="slds-col slds-size_8-of-12 slds-m-bottom_small">
                                                    <p class="address-value">
                                                        {selectedShipping.ShipStreet}<br>{selectedShipping.ShippingCity}{selectedShipping.Provionce} {selectedShipping.PostalCode}<br>{selectedShipping.ShippingCountry}
                                                    </p>
                                                </div>
                                            </div>
                                        </template>
                                        <template if:true={showShipAddressEmptyPage}>
                                            <div class="slds-grid slds-wrap slds-gutters">
                                                <div class="slds-col slds-size_11-of-12">
                                                    <p class="address-label">Return documents for any associated
                                                        Shipping Address </p>
                                                </div>
                                                <div class="slds-col slds-size_8-of-12">
                                                    <p class="address-value"></p>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </template>
                <template if:false={confirmAddress}>
                    <div class="slds-col slds-size_3-of-3 max-width-container slds-p-around_none">
                        <template if:false={isInternal}>
                            <div class="slds-tabs_default slds-tabs_medium slds-m-top_xx-large">
                                <ul class="slds-tabs_default__nav" role="tablist">
                                    <li class="slds-tabs_default__item slds-is-active" role="presentation"
                                        data-id="tab-default-1__item">
                                        <a class="slds-tabs_default__link" href="#null" role="tab" tabindex="0"
                                            aria-selected={quickTabSelected} aria-controls="quick-tab-content"
                                            data-id="tab-default-1__item" data-value="Order"
                                            onclick={handleActive}>Quick</a>
                                    </li>
                                    <li class="slds-tabs_default__item" role="presentation"
                                        data-id="tab-default-2__item">
                                        <a class="slds-tabs_default__link" href="#null" role="tab"
                                            aria-selected={advancedTabSelected} aria-controls="advanced-tab-content"
                                            data-id="tab-default-2__item" data-value="Shipment"
                                            onclick={handleActive}>Advanced</a>
                                    </li>
                                </ul>
                            </div>
                        </template>
                        <lightning-card class="search-result-cards">
                            <h1 class="slds-text-heading_medium slds-m-around_small slds-p-horizontal_large search-criteria-title order-detail-table-header"
                                aria-level="2">
                                Request Document
                            </h1>
                            <div
                                class="slds-form slds-p-top_large slds-p-horizontal_x-large slds-p-bottom_x-large search-fields-group slds-show">
                                <div class="slds-grid slds-wrap">
                                    <div class="slds-col slds-size_1-of-3">
                                        <div class="slds-form-element" id="quick-tab-content">
                                            <lightning-combobox class="statuscombobox requestCombobox" label="Request"
                                                placeholder="Select Option" value={SearchByvalue}
                                                options={SearchByOptions} onchange={handleSearchOptionChange}
                                                onopen={handleAriaExpanded} aria-expanded={isrequestComboboxExpanded}>
                                            </lightning-combobox>
                                        </div>
                                        <template if:true={isAdvanced}>
                                            <div class="pod-note slds-m-bottom_small slds-assistive-text">Note: Proof of
                                                Delivery is only available for UPS & FedEx Shipments</div>
                                        </template>
                                    </div>
                                    <template if:true={InvoiceSelect}>
                                        <template if:false={isAdvanced}>
                                            <div class="slds-col slds-size_1-of-3">
                                                <div class="slds-form-element">
                                                    <label class="slds-form-element__label" for="by-invoice">Document #*<span class="slds-assistive-text">Required</span></label>
                                                    <div class="slds-form-element__control">
                                                        <input type="text" id="by-invoice" placeholder="Document #" class="slds-input" onkeyup={handleInvoNumChange} onchange={handleInvoNumChange} value={InvoNum} />
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                        <template if:true={isAdvanced}>
                                            <div class="slds-col slds-size_1-of-3">
                                                <div class="slds-form-element">
                                                    <label class="slds-form-element__label" for="by-invoice4678">Document #</label>
                                                    <div class="slds-form-element__control">
                                                        <input type="text" id="by-invoice4678" placeholder="Document #" class="slds-input" onkeyup={handleInvoNumChange} onchange={handleInvoNumChange} value={InvoNum} />
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="slds-form-element slds-size_1-of-3">
                                                <lightning-combobox class="statuscombobox" label='Invoice Status'
                                                    value={InvoiceStatusValue} options={InvoiceStatusOptions}
                                                    onchange={handleInvoiceStatusOptionChange}></lightning-combobox>
                                            </div>
                                            <div class="slds-col slds-form-element slds-size_1-of-3">
                                                <label class="slds-form-element__label" for="by-PO">PO #</label>
                                                <div class="slds-form-element__control">
                                                    <input type="text" id="by-PO" placeholder="PO #" class="slds-input" onkeyup={handlePONumChange} onchange={handlePONumChange} value={PONum} />
                                                </div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-3">
                                                <div class="slds-grid">
                                                    <div class="slds-col slds-size_1-of-2 slds-p-left_none">
                                                        <div class="slds-form-element">
                                                            <label class="slds-form-element__label order-date-label" for="order-from-date12">{labels.scc_home_Order_Date}  <span class="label-sub-text">(From)</span><div class="slds-assistive-text">Note: Upto 24 months</div></label>
                                                            <div class="slds-form-element__control slds-is-relative">
                                                                <input type="date" id="order-from-date12" placeholder={labels.scc_home_From} class="slds-input" value={startDate} onkeyup={handleStartDateChange} onchange={handleStartDateChange} min={minimumDate} />
                                                                <img class="calender-icon" alt="calender icon" src={labels.scc_calender_icon} />
                                                            </div>
                                                        </div>
                                                        <div class="date-note">Note: Upto 24 months</div>
                                                    </div>
                                                    <div class="slds-col slds-size_1-of-2 slds-p-right_none">
                                                        <div class="slds-form-element">
                                                            <label class="slds-form-element__label order-date-label" for="order-to-date12">{labels.scc_home_Order_Date}  <span class="label-sub-text">(To)</span></label>
                                                            <div class="slds-form-element__control slds-is-relative">
                                                                <input type="date" id="order-to-date12" placeholder={labels.scc_home_To} class="slds-input" value={endDate} onkeyup={handleEndDateChange} onchange={handleEndDateChange} min={minimumDate}/>
                                                                <img class="calender-icon" alt="calender icon" src={labels.scc_calender_icon} />
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                    </template>
                                    <template if:true={DebitMemoSelect}>
                                        <template if:false={isAdvanced}>
                                            <div class="slds-col slds-size_1-of-3">
                                                <div class="slds-form-element">
                                                    <label class="slds-form-element__label" for="by-invoice2">Document #*<span class="slds-assistive-text">Required</span></label>
                                                    <div class="slds-form-element__control">
                                                        <input type="text" id="by-invoice2" placeholder="Document #" class="slds-input" onkeyup={handleInvoNumChange} onchange={handleInvoNumChange} value={InvoNum} />
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                        <template if:true={isAdvanced}>
                                            <div class="slds-col slds-size_1-of-3">
                                                <div class="slds-form-element">
                                                    <label class="slds-form-element__label" for="by-invoice46789">Document #</label>
                                                    <div class="slds-form-element__control">
                                                        <input type="text" id="by-invoice46789" placeholder="Document #" class="slds-input" onkeyup={handleInvoNumChange} onchange={handleInvoNumChange} value={InvoNum} />
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="slds-col slds-form-element slds-size_1-of-3">
                                                <label class="slds-form-element__label" for="by-PO1">PO #</label>
                                                <div class="slds-form-element__control">
                                                    <input type="text" id="by-PO1" placeholder="PO #" class="slds-input" onkeyup={handlePONumChange} onchange={handlePONumChange} value={PONum} />
                                                </div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-3">
                                                <div class="slds-grid">
                                                    <div class="slds-col slds-size_1-of-2 slds-p-left_none">
                                                        <div class="slds-form-element">
                                                            <label class="slds-form-element__label order-date-label" for="order-from-date12">{labels.scc_home_Order_Date}  <span class="label-sub-text">(From)</span><div class="slds-assistive-text">Note: Upto 24 months</div></label>
                                                            <div class="slds-form-element__control slds-is-relative">
                                                                <input type="date" id="order-from-date123" placeholder={labels.scc_home_From} class="slds-input" value={startDate} onkeyup={handleStartDateChange} onchange={handleStartDateChange} min={minimumDate} />
                                                                <img class="calender-icon" alt="calender icon" src={labels.scc_calender_icon} />
                                                            </div>
                                                        </div>
                                                        <div class="date-note">Note: Upto 24 months</div>
                                                    </div>
                                                    <div class="slds-col slds-size_1-of-2 slds-p-right_none">
                                                        <div class="slds-form-element">
                                                            <label class="slds-form-element__label order-date-label" for="order-to-date12">{labels.scc_home_Order_Date}  <span class="label-sub-text">(To)</span></label>
                                                            <div class="slds-form-element__control slds-is-relative">
                                                                <input type="date" id="order-to-date123" placeholder={labels.scc_home_To} class="slds-input" value={endDate} onkeyup={handleEndDateChange} onchange={handleEndDateChange} min={minimumDate}/>

                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                    </template>
                                    <template if:true={CreditMemoSelect}>
                                        <template if:false={isAdvanced}>
                                            <div class="slds-col slds-size_1-of-3">
                                                <div class="slds-form-element">
                                                    <label class="slds-form-element__label" for="by-invoice3">Document #*<span class="slds-assistive-text">Required</span></label>
                                                    <div class="slds-form-element__control">
                                                        <input type="text" id="by-invoice3" placeholder="Document #" class="slds-input" onkeyup={handleInvoNumChange} onchange={handleInvoNumChange} value={InvoNum} />
                                                    </div>

                                            </div>
                                        </template>
                                        <template if:true={isAdvanced}>
                                            <div class="slds-col slds-size_1-of-3">

                                                    <label class="slds-form-element__label" for="by-invoice09">Document #</label>
                                                    <div class="slds-form-element__control">
                                                        <input type="text" id="by-invoice09" placeholder="Document #" class="slds-input" onkeyup={handleInvoNumChange} onchange={handleInvoNumChange} value={InvoNum} />
                                                    </div>

                                            </div>
                                            <div class="slds-col slds-form-element slds-size_1-of-3">
