<template>
	<div class="slds-grid slds-wrap slds-grid_vertical slds-p-horizontal_x-large slds-p-vertical_medium order-status-BG slds-is-relative">
		<template if:true={fedExTrack}>
			<template if:true={trackingDetails}>
				<div class="card-wrapper">
					<div class="slds-grid slds-wrap slds-is-relative">
						<div class="slds-col slds-size_1-of-3 slds-p-right_medium"  style="min-height:369px;">
							<lightning-card class="fedEx-cards">
								<h2>
									<div class="slds-box customHead" role="alert">
										<div class="slds-assistive-text">Order is</div> {status}
										<div class="slds-assistive-text">Tracking # {trackingId} Delivery Detail {delivery_Detail.description},&nbsp;{delivery_Detail.date} at {delivery_Detail.time} Received By {receivedBy}</div>
									</div>
								</h2>
								<div class="slds-p-around_medium">
									<div class="table2-container">
										<table class="tableData-alignment">
											<tbody>
												<tr>
													<td class=" wrapSpace trackAlign">Tracking #</td>
													<td class="left-align">{trackingId}</td>
												</tr>
												<tr>
													<td class=" wrapSpace trackAlign">Delivery Detail</td>
													<template if:true={deliveryDetails}>
														<td class="left-align">{delivery_Detail.description},&nbsp;{delivery_Detail.date} at {delivery_Detail.time}</td>
													</template>
												</tr>
												<tr>
													<td class="wrapSpace trackAlign">Received By</td>
													<td class="left-align">{receivedBy}</b></td>
												</tr>
											</tbody>
										</table>
									</div>
								</div>
							</lightning-card>
						</div>
						<div class="slds-card slds-col slds-size_2-of-3" style="min-height:369px;">
								<h2
									class="slds-text-heading_medium custom1 slds-m-around_medium slds-p-horizontal_large ">
									Travel History
								</h2>
								<div class="slds-p-around_xx-small">
									<div class="slds-p-horizontal_small custom1 slds-p-vertical_small">
										<div class="table-container">
											<table class="borderless-table">
												<tbody>													
													<template for:each={eventsTrack} for:item="eventGroup">
														<template for:each={eventGroup.events} for:item="event" for:index="index">
														<tr key={event.key} class="botton-align">
															<template if:true={event.isFirst}>															
															  <td rowspan={eventGroup.events.length} class="top-align">{event.date}</td>
															</template>
															<td>{event.time}</td>
															<td>
																<img src={approveIconUrl} alt="approve" style="width: 12px;height: 12px;">													
															</td>
															<td class="custom2">{event.description}</td>
															<td>{event.location}</td>
														</tr>
														</template>
													</template> 
												</tbody>
											</table>
										</div>
									</div>
								</div>
						</div>
						<!-- Shipment-overview -->
						<div class="slds-col slds-size_1-of-1 slds-m-top_large max-width-container">
							<lightning-card>
								<h2
									class="slds-text-heading_medium shipment-overview slds-m-around_small slds-p-horizontal_large order-detail-table-header ">
									Shipment Overview
								</h2>
								<div class="slds-p-around_medium">
									<table class="tableData-alignment2">
										<tbody>
											<tr>
												<td class="right-align">Tracking #</td>
												<td class="left-align"><b>{trackingId}</b></td>
											</tr>
											<tr>
												<td class="right-align">Ship Date</td>
												<td class="left-align"><b>{shipmentDate}</b></td>
											</tr>
											<tr>
												<td class="right-align">Expected Delivery Date </td>
												<td class="left-align"><b>{actualDate}</b></td>
											</tr>
										</tbody>
									</table>

								</div>
							</lightning-card>
						</div>
						<!-- Package-details -->
						<div class="slds-col slds-size_1-of-1 slds-m-top_large max-width-container">
							<lightning-card>
								<h2
									class="slds-text-heading_medium shipment-overview slds-m-around_small slds-p-horizontal_large order-detail-table-header ">
									Package Details
								</h2>
								<div class="slds-p-around_medium">
									<table class="tableData-alignment3">
										<tbody>
											<tr>
												<td class="right-align">Weight</td>
												<td class="left-align"><b>{weight}</b></td>
											</tr>
											<tr>
												<td class="right-align">Dimensions </td>
												<td class="left-align"><b>{dimensions}.</b></td>
											</tr>
											<tr>
												<td class="right-align">Total Pieces</td>
												<td class="left-align"><b>{totalPieces}</b></td>
											</tr>
											<tr>
												<td class="right-align">Packaging</td>
												<td class="left-align">{packagingUpperCase}</td>
											</tr>
										</tbody>
									</table>
								</div>
							</lightning-card>
						</div>
					</div>
				</div>
			</template>
		</template>
	</div>
</template>
