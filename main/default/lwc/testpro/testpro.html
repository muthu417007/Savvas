<template>


		<!-- Quick Search component  -->

	<template if:true={isquickSearch}>
		<div class="search-container">

			<div class="slds-grid slds-m-bottom_medium align-buttons">
				<div class="slds-col slds-size_8-of-12"></div>
				<div class="slds-col slds-size_1-of-12 slds-float_right">
				</div>
				<div class="slds-grid slds-grid_align-end ">
					<div class="slds-col">
						<lightning-button label="Clear Search" onclick={handleClear}
							class="slds-m-left_x-small neutral-button-text-color"></lightning-button>
					</div>
					&nbsp;&nbsp;
					<div class="slds-col">
						<lightning-button variant="brand" label="Search" disabled={isSearchDisabled}
							onclick={handleSearch} class="slds-m-left_x-small"></lightning-button>
					</div>
				</div>


			</div>


			<div
				class="slds-box slds-theme_shade slds-p-vertical_xx-small slds-m-vertical_xx-small slds-p-horizontal_none">
				<div class="slds-grid slds-grid_vertical-align-center">
					<lightning-icon size="xx-small" icon-name="utility:chevrondown" alternative-text="chevrondown">
					</lightning-icon>
					<div>&nbsp;&nbsp;Multi ISBN</div>
				</div>
			</div>

			<div class="ISBN-Name">
				<h4>ISBN(s)</h4>
			</div>
			<div class="text-area-inputchange">
				<textarea class="arvicon-input" rows="10" cols="50"  oninput={handleInputChange}></textarea>
				<div>To search for multiple titles at once, paste list of ISBNs one ISBN per line  </div>
			</div>




		</div>
		<div class="search-result-value">
			<div
				class="slds-box slds-theme_shade slds-p-vertical_xx-small slds-m-vertical_xx-small slds-p-horizontal_none">
				<div class="slds-grid slds-grid_vertical-align-center">
					<lightning-icon size="xx-small" icon-name="utility:chevrondown" alternative-text="chevrondown">
					</lightning-icon>
					<div>&nbsp;&nbsp;Search Result</div>
				</div>
			</div>

		</div>
			<!-- Pagination Search Results  -->
  <div class="slds-col">
                                    <div class="slds-list_inline slds-p-bottom_xx-small">
                                        <label class="slds-text-color_weak slds-p-horizontal_x-small" for="recordsPerPage"># of Rows</label>
                                        <div class="slds-select_container">
                                            <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                                                <template for:each={pageSizeOptions} for:item="option">
                                                    <option key={option} value={option}>{option}</option>
                                                </template>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <!-- Page Navigation Buttons -->
                                <div class="slds-align_absolute-center" style="height:5rem">
                                    <lightning-button disabled={bDisableFirst} variant="brand" icon-name="utility:jump_to_left" label="First" class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage}></lightning-button>
                                    <lightning-button disabled={bDisablePrevious} variant="brand" icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage}></lightning-button>
                                    &nbsp;
                                    <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                                    &nbsp;
                                    <lightning-button disabled={bDisableNext} variant="brand" icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                                    <lightning-button disabled={bDisableLast} variant="brand" icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                                </div>
                            </div>
                                 <div class="slds-form-element__control">
                                    <lightning-input type="search" 
                                                     label="" 
                                                    onchange={handleSearchInputChange}></lightning-input>
                            </div>
                            <!-- Data Table -->
                            <div class="slds-col">
                                <!-- <div class="slds-scrollable" style="height: 300px;"> -->
                                    <div class="slds-m-around_small">
                                        <lightning-datatable data-id="datatable" data={currentPagetableData}
                                            columns={columns} hide-checkbox-column="true" key-field="Id"
                                            onrowaction={handleRowAction} default-sort-direction={defaultSortDirection}
                                            sorted-direction={sortDirection} sorted-by={sortedBy} onsort={onHandleSort}>
                                        </lightning-datatable>
                                    </div>
                                <!-- </div> -->
                            </div>
                        </div>
                    </template>
                </template>
            </lightning-tab>

	</template>


	


</template>
