<template>
    <lightning-card title="Accounts">
        <div class="slds-m-around_medium">
            <template if:true={data}>
                <lightning-datatable
                    data={data}
                    columns={columns}
                    key-field="accAddLink"
                    hide-checkbox-column>
                </lightning-datatable>
            </template>
            <template if:true={noData}>
                {noData}
            </template>
            <template if:true={error}>
                {error}
            </template>
        </div>
    </lightning-card>
</template>
