<template>
    <button onclick={handleSubmitOrder}>Submit Order</button>
    <template if:true={showSIOP}>
        <c-scc_register-s-i-o-p-participant-l-w-c onclosepopup={closeSubmitOrder}></c-scc_register-s-i-o-p-participant-l-w-c>
    </template>
    <lightning-card class="order-detail-tab-card">
        <div class="slds-grid slds-wrap slds-p-around_x-small">
            <div class="slds-col slds-size_2-of-12 slds-text-align_right order-detail-label">
                {labels.scc_OrderStatus_Ship_To_Account} 
            </div>
            <div class="slds-col slds-size_4-of-12 order-detail-value">
                {ShipToAccount}
            </div>
            <div class="slds-col slds-size_2-of-12 slds-text-align_right order-detail-label">
                {labels.scc_home_Order_Date}
            </div>
            <div class="slds-col slds-size_4-of-12 order-detail-value">
                {CustomerPurchaseOrderDate}
            </div>
        </div>
        <div class="slds-grid slds-wrap slds-p-around_x-small">
            <div class="slds-col slds-size_2-of-12 slds-text-align_right order-detail-label">
                {labels.scc_OrderDetail_Ship_To} 
            </div>
            <div class="slds-col slds-size_4-of-12 order-detail-value">
                {ShipTo}
            </div>
            <div class="slds-col slds-size_2-of-12 slds-text-align_right order-detail-label">
                Request Ship Date
            </div>
            <div class="slds-col slds-size_4-of-12 order-detail-value">
                {RequestedDeliveryDate}
                <div class="slds-is-relative slds-show_inline-block slds-m-left_xx-small">
                    <div class="slds-show_inline-block info-icon slds-m-right_xx-small slds-text-align_center">i</div>
                    <!-- <div class="slds-popover slds-popover_tooltip slds-nubbin_bottom-left" role="tooltip" id="2">
                        <div class="slds-popover__body">{labels.scc_OrderDetail_Requested_Shipment_Date_tooltip}</div>
                    </div> -->
                </div>
            </div>
        </div>
        <div class="slds-grid slds-wrap slds-p-around_x-small">
            <div class="slds-col slds-size_2-of-12 slds-text-align_right order-detail-label">
                {labels.scc_home_PO} 
            </div>
            <div class="slds-col slds-size_4-of-12 order-detail-value">
                {CustomerPurchaseOrderNumber}
            </div>
            <div class="slds-col slds-size_2-of-12 slds-text-align_right order-detail-label">
                {labels.scc_OrderDetail_Order_Method}
            </div>
            <div class="slds-col slds-size_4-of-12 order-detail-value">
                {CustomerPurchaseOrderType}
            </div>
        </div>
        <div class="slds-grid slds-wrap slds-p-around_x-small">
            <div class="slds-col slds-size_2-of-12 slds-text-align_right order-detail-label">
                {labels.scc_home_Document_Control} 
            </div>
            <div class="slds-col slds-size_4-of-12 order-detail-value">
                {orderNumber}
            </div>
            <div class="slds-col slds-size_2-of-12 slds-text-align_right order-detail-label">
                {labels.scc_home_Status}
            </div>
            <div class="slds-col slds-size_4-of-12 order-detail-value">
                {OverallStatusDescription}
            </div>
        </div>
        <div class="slds-m-horizontal_xx-large slds-m-vertical_medium slds-p-horizontal_xx-large slds-p-vertical_medium alert-note slds-text-align_center">
            <div class="slds-show_inline-block note-icon slds-m-right_xx-small">!</div>
            <b>Please note:</b> Fulfillment In Process items have an average delivery time of 7-10 business days
        </div>
    </lightning-card>
    <div class="slds-m-top_large">
        <lightning-card class="search-result-cards">
            <div class="slds-grid slds-wrap slds-p-horizontal_medium">
                <div class="slds-col slds-size_3-of-3 order-detail-table-header">
                    <div class="search-criteria-title">{labels.scc_OrderDetail_Order_Line_Detail}</div>
                </div>
                <div class="slds-col slds-size_3-of-3 slds-form slds-p-horizontal_large slds-p-vertical_x-small">
                    <div class="slds-grid slds-wrap slds-p-bottom_xx-small slds-m-vertical_large">
                        <div class="slds-col slds-size_7-of-12 slds-p-horizontal_none">
                            <div class="slds-form-element__control">
                                <button class="slds-button table-control-button" disabled={bDisableFirst} onclick={firstPage}>&#60;&#60; First</button>
                                <button class="slds-button table-control-button" disabled={bDisableFirst} onclick={previousPage}>&#60; Previous</button>
                                <p class="page-count-shown slds-m-horizontal_x-small">Showing {pageNumber} of {totalPages} Page(s)</p>
                                <button class="slds-button table-control-button" disabled={bDisableLast} onclick={nextPage}>Next &#62;</button>
                                <button class="slds-button table-control-button" disabled={bDisableLast} onclick={lastPage}>Last &#62;&#62;</button>
                            </div>
                        </div>
                        <div class="slds-col slds-size_5-of-12 table-row-count slds-text-align_right slds-p-horizontal_none">
                            <select class="slds-select" id="row-count1" onchange={handleRecordsPerPage}>
                                <template for:each={pageSizeOptions} for:item="option">
                                    <option style="font-size:12px;" key={option} value={option}>{option}</option>
                                </template>
                            </select>        
                            <label class="slds-form-element__label" for="row-count1">{labels.scc_Order_Status_no_of_rows}</label>
                            <span>{totalRecords} {labels.scc_Order_Status_items}</span>
                        </div>
                    </div>
                    
                </div>
                <table class="slds-table slds-table_bordered slds-table_fixed-layout slds-p-horizontal_small" role="grid" aria-label="Example advanced table of Opportunities in actionable mode with ascending column sorting">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th aria-sort="ascending" class="slds-is-sortable slds-is-sorted slds-is-sorted_asc slds-cell_action-mode" scope="col" style="width: 6%;">
                                <a class="slds-th__action slds-text-link_reset" href="#" role="button" tabindex="0">
                                    <span class="slds-assistive-text">Sort by: </span>
                                    <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                                        <span title="Name">Seq</span>
                                        <lightning-icon class="table-sort-icon slds-m-right_xx-small" icon-name='utility:chevrondown' alternative-text='chevrondown' size='large' title='chevrondown'></lightning-icon>
                                    </div>
                                </a>
                                <span class="slds-assistive-text" aria-live="polite" aria-atomic="true">Sorted ascending</span>
                            </th>
                            <th aria-sort="none" class="slds-is-sortable slds-cell_action-mode" scope="col" style="width: 12%;">
                                <a class="slds-th__action slds-text-link_reset" href="#" role="button" tabindex="0">
                                <span class="slds-assistive-text">Sort by: </span>
                                <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                                <span title="Account Name">ISBN</span>
                                <lightning-icon class="table-sort-icon slds-m-right_xx-small" icon-name='utility:chevrondown' alternative-text='chevrondown' size='large' title='chevrondown'></lightning-icon>
                                </div>
                                </a>
                            </th>
                            <!-- <th aria-sort="none" class="slds-is-sortable slds-cell_action-mode" scope="col" style="width: 14%;">
                                <a class="slds-th__action slds-text-link_reset" href="#" role="button" tabindex="0">
                                <span class="slds-assistive-text">Sort by: </span>
                                <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                                <span title="Close Date">Title</span>
                                <lightning-icon class="table-sort-icon slds-m-right_xx-small" icon-name='utility:chevrondown' alternative-text='chevrondown' size='large' title='chevrondown'></lightning-icon>
                                </div>
                                </a>
                            </th> -->
                            <th aria-sort="none" class="slds-is-sortable slds-cell_action-mode" scope="col">
                                <a class="slds-th__action slds-text-link_reset" href="#" role="button" tabindex="0">
                                <span class="slds-assistive-text">Sort by: </span>
                                <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                                <span title="Stage">Price</span>
                                <lightning-icon class="table-sort-icon slds-m-right_xx-small" icon-name='utility:chevrondown' alternative-text='chevrondown' size='large' title='chevrondown'></lightning-icon>
                                </div>
                                </a>
                            </th>
                            <th aria-sort="none" class="slds-is-sortable slds-cell_action-mode" scope="col">
                                <a class="slds-th__action slds-text-link_reset" href="#" role="button" tabindex="0">
                                <span class="slds-assistive-text">Sort by: </span>
                                <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                                <span title="Confidence">Pricing Method</span>
                                <lightning-icon class="table-sort-icon slds-m-right_xx-small" icon-name='utility:chevrondown' alternative-text='chevrondown' size='large' title='chevrondown'></lightning-icon>
                                </div>
                                </a>
                            </th>
                            <th aria-sort="none" class="slds-is-sortable slds-cell_action-mode" scope="col" style="width: 8%;">
                                <a class="slds-th__action slds-text-link_reset" href="#" role="button" tabindex="0">
                                <span class="slds-assistive-text">Sort by: </span>
                                <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                                <span title="Amount">Discount</span>
                                <lightning-icon class="table-sort-icon slds-m-right_xx-small" icon-name='utility:chevrondown' alternative-text='chevrondown' size='large' title='chevrondown'></lightning-icon>
                                </div>
                                </a>
                            </th>
                            <th aria-sort="none" class="slds-is-sortable slds-cell_action-mode" scope="col">
                                <a class="slds-th__action slds-text-link_reset" href="#" role="button" tabindex="0">
                                <span class="slds-assistive-text">Sort by: </span>
                                <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                                <span title="Contact">Qty Ordered</span>
                                <lightning-icon class="table-sort-icon slds-m-right_xx-small" icon-name='utility:chevrondown' alternative-text='chevrondown' size='large' title='chevrondown'></lightning-icon>
                                </div>
                                </a>
                            </th>
                            <th aria-sort="none" class="slds-is-sortable slds-cell_action-mode" scope="col">
                                <a class="slds-th__action slds-text-link_reset" href="#" role="button" tabindex="0">
                                <span class="slds-assistive-text">Sort by: </span>
                                <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                                <span title="Contact">Qty Closed</span>
                                <lightning-icon class="table-sort-icon slds-m-right_xx-small" icon-name='utility:chevrondown' alternative-text='chevrondown' size='large' title='chevrondown'></lightning-icon>
                                </div>
                                </a>
                            </th>
                            <th aria-sort="none" class="slds-is-sortable slds-cell_action-mode" scope="col">
                                <a class="slds-th__action slds-text-link_reset" href="#" role="button" tabindex="0">
                                <span class="slds-assistive-text">Sort by: </span>
                                <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                                <span title="Contact">To Be Shipped</span>
                                <lightning-icon class="table-sort-icon slds-m-right_xx-small" icon-name='utility:chevrondown' alternative-text='chevrondown' size='large' title='chevrondown'></lightning-icon>
                                </div>
                                </a>
                            </th>
                            <th aria-sort="none" class="slds-is-sortable slds-cell_action-mode" scope="col" style="width: 14%;">
                                <a class="slds-th__action slds-text-link_reset" href="#" role="button" tabindex="0">
                                <span class="slds-assistive-text">Sort by: </span>
                                <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                                <span title="Contact">Status</span>
                                <lightning-icon class="table-sort-icon slds-m-right_xx-small" icon-name='utility:chevrondown' alternative-text='chevrondown' size='large' title='chevrondown'></lightning-icon>
                                </div>
                                </a>
                            </th>
                            <th aria-sort="none" class="slds-is-sortable slds-cell_action-mode" scope="col">
                                <a class="slds-th__action slds-text-link_reset" href="#" role="button" tabindex="0">
                                <span class="slds-assistive-text">Sort by: </span>
                                <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                                <span title="Contact">Status Updated</span>
                                <lightning-icon class="table-sort-icon slds-m-right_xx-small" icon-name='utility:chevrondown' alternative-text='chevrondown' size='large' title='chevrondown'></lightning-icon>
                                </div>
                                </a>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={orderLineRecords} for:item='line'>
                            <tr aria-selected="false" class="slds-hint-parent" key={line.Identi}>
                                <th class="slds-cell_action-mode" scope="row">
                                    <div title={line.SalesItem}>{line.SalesItem}</div>
                                </th>
                                <td class="slds-cell_action-mode" role="gridcell">
                                    <div title={line.Material}>{line.Material}</div>
                                </td>
                                <!-- <td class="slds-cell_action-mode" role="gridcell">
                                    <div title={line.ItemDescription}>{line.ItemDescription}</div>
                                </td> -->
                                <td class="slds-cell_action-mode" role="gridcell">
                                    <div title={line.NetValueInDocumentCurrency}>{line.NetValueInDocumentCurrency}</div>
                                </td>
                                <td class="slds-cell_action-mode" role="gridcell">
                                    <div title={line.MaterialPricingGroupDescription}>{line.MaterialPricingGroupDescription}</div>
                                </td>
                                <td class="slds-cell_action-mode" role="gridcell">
                                    <div title={line.Discount}>{line.Discount}</div>
                                </td>
                                <td class="slds-cell_action-mode" role="gridcell">
                                    <div title={line.OrderQuantity}>{line.OrderQuantity}</div>
                                </td>
                                <td class="slds-cell_action-mode" role="gridcell">
                                    <div title={line.QtyClosed}><a onclick={handleShipDetails} tabindex="0">{line.QtyClosed}</a></div>
                                </td>
                                <td class="slds-cell_action-mode" role="gridcell">
                                    <div title={line.TobeShipped}>{line.TobeShipped}</div>
                                </td>
                                <td class="slds-cell_action-mode" role="gridcell">
                                    <div>
                                        {line.LineStatus}
                                        <!-- <div class="slds-is-relative slds-show_inline-block slds-p-around_none slds-m-left_xx-small">
                                            <div class="slds-show_inline-block info-icon slds-m-right_xx-small slds-text-align_center">i</div>
                                            <div class="slds-popover slds-popover_tooltip slds-nubbin_bottom-left" role="tooltip" id="5">
                                                <div class="slds-popover__body">Reason for respective status</div>
                                            </div>
                                        </div> -->
                                    </div>
                                </td>
                                <td class="slds-cell_action-mode" role="gridcell">
                                    <div title={line.updatedStatusDate}>{line.updatedStatusDate}</div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </lightning-card>
    </div>
</template>
