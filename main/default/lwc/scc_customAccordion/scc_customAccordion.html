<template>
    <div class="custom-accordion">
        <div class="accordion-item" for:each={sections} for:item="section" key={section.id}>
            <div class="accordion-header" onclick={toggleSection} data-section-id={section.id}>
                <div class="accordion-title">{section.title}</div>
                <div class="accordion-icon"></div>
            </div>
            <div>
                {section.content}
            </div>
        </div>
    </div>
</template>
