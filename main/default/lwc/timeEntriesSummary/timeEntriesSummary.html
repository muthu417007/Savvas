<template if:true={isModalOpen}>
	<!-- Modal/Popup Box LWC starts here -->
	<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
		aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
		<div class="slds-modal__container">
			<!-- Modal/Popup Box LWC header here -->
			<header class="slds-modal__header">
				<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close"
                            alternative-text="close"
                            variant="inverse"
                            size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
				<h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Timesheet Missing Assignment
				</h2>
			</header>
			<!-- Modal/Popup Box LWC body starts here -->
			<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
				<p><b><!--You are assigned to Service Appointments but you have not entered any time against it. Are you sure you want to submit your timesheet?-->
				{noSAEntry}
                    </b></p>
				<!-- <p><b>This paradigm is utilized in instances that include the creation or modification of a record, as well as numerous forms of messaging and wizards.
 
                    </b></p>-->

			</div>
			<!-- Modal/Popup Box LWC footer starts here -->
			<footer class="slds-modal__footer">
				<button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel">Cancel</button>
				<button class="slds-button slds-button_brand" onclick={submitDetails} title="OK">Submit</button>
			</footer>
		</div>
	</section>
	<div class="slds-backdrop slds-backdrop_open"></div>
</template>
<template if:true={isModalOpenSubmit}>
	<!-- Modal/Popup Box LWC starts here -->
	<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-02" aria-modal="true"

			</header>
			<!-- Modal/Popup Box LWC body starts here -->
			<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">

                    </b></p>


			</div>
			<!-- Modal/Popup Box LWC footer starts here -->
			<footer class="slds-modal__footer">
