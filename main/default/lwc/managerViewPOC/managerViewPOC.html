<template>
	<div class="box">
		<div class="box-container">
			<div class="row user">
				{userName}
			</div>
			<div class="row header">
				<p>Your Team's Weekly Time Sheets Summary</p>
			</div>
			<template if:true={showErrorMessage}>
				<div class="row error">
					{errorMessage}
				</div>
			</template>
			<template if:false={showErrorMessage}>
				<template if:true={isLoading}>
					<div class="slds-is-relative slds-var-p-around_large">
						<lightning-spinner alternative-text="Loading..." variant="brand">
						</lightning-spinner>
					</div>
				</template>
				<template if:false={isLoading}>
					<div class="row action">
						<div class="slds-clearfix">
							<div class="search slds-float_left">
								<lightning-input type="search" placeholder="Search" variant='label-hidden'
									onchange={handleClientSideSearch}></lightning-input>
							</div>
							<div class="buttons slds-float_right">
								<lightning-button variant="brand" label="Approve" title="Approve"
									onclick={handleApprove} disabled={buttonsDisabled}></lightning-button>
								&nbsp;
								<lightning-button variant="destructive" label="Reject" title="Reject"
									onclick={handleReject} disabled={buttonsDisabled}></lightning-button>
							</div>
						</div>
					</div>
					<div class="row content">
						<lightning-datatable columns={columns} data={recordsToDisplay} key-field="id"
							onrowselection={getSelectedRows} selected-rows={selectedRowIds} sorted-by={sortBy}
							sorted-direction={sortDirection} onsort={doSorting} onrowaction={handleRowAction}>
						</lightning-datatable>
					</div>
					<div class="row footer">
						<!-- PAGINATION -->
						<div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
							<!--RECORDS PER PAGE-->
							<div class="slds-col" style="padding-right: 0.5rem;padding-top: 0.3rem;">
								<div class="slds-list_inline slds-align_absolute-center slds-var-p-bottom_xx-small">
									<label class="slds-text-color_weak slds-var-m-right_x-small" for="recordsPerPage">Page Size:</label>
									<div class="slds-select_container">
										<select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                            <template for:each={pageSizeOptions} for:item="option">
                                <option key={option} value={option}>{option}</option>
                            </template>
                        </select>
									</div>
								</div>
							</div>
							<!--PAGE NAVIGATION-->
							<div class="slds-align_absolute-center" style="height:3rem">
								<lightning-button class="slds-var-m-right_x-small" disabled={bDisableFirst}
									icon-name="utility:chevronleft" label="Previous" alternative-text="Previous"
									onclick={previousPage}></lightning-button>
								&nbsp;
								<span class="slds-badge slds-var-m-right_x-small">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
								&nbsp;
								<lightning-button class="slds-var-m-right_x-small" disabled={bDisableLast}
									icon-name="utility:chevronright" label="Next" alternative-text="Next"
									onclick={nextPage} icon-position="right"></lightning-button>
							</div>
							<!--TOTAL RECORDS-->
							<div class="slds-clearfix">
								<div class="slds-float_right">
									<span class="slds-badge"> Total Records: {totalRecords}</span>
								</div>
							</div>
						</div>
					</div>
				</template>
			</template>
		</div>
	</div>
	<template if:true={showRejectModal}>
		<section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="Reject-Timesheets-Modal"
			class="slds-modal slds-fade-in-open slds-modal_small">
			<div class="slds-modal__container">
				<!-- Close Button -->
				<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse">
          <lightning-icon class="close-icon" icon-name="utility:close" alternative-text="Close" title="Close" onclick={closeRejectModal}></lightning-icon>
        </button>
				<!-- Header Section -->
				<div class="slds-modal__header">
					<h1 id="Advanced-Search-Modal-Header" class="slds-modal__title slds-hyphenate">Reject Timesheets
					</h1>
				</div>
				<!-- Body Section -->
				<div class="slds-modal__content slds-var-p-around_medium">
					<lightning-textarea name="Comments" required value={commentsValue} onchange={handleComments}
						placeholder="Specify the reasons for rejection of submitted timesheets..." label="Comments"
						maxlength="2500" message-when-too-long="A maximum of 2500 characters are allowed."
						message-when-value-missing="Empty comments cannot be posted."></lightning-textarea>
				</div>
				<div class="slds-modal__footer">
					<button class="slds-button slds-button_neutral" aria-label="Cancel" onclick={closeRejectModal}>Cancel</button>
					<button class="slds-button slds-button_brand" aria-label="Submit" onclick={submitRejection}>Submit</button>
				</div>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
	</template>
</template>
