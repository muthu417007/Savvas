<template>
<template if:true={isHeaders}>
           
       <c-scc-header-l-w-c></c-scc-header-l-w-c>
        </template>

    <div class="mainPage slds-align_absolute-center">
        

      <lightning-card  class="RegisterNewUser">
         
     <h1 class="Register" > {registerMsg}</h1>
     <div class="text-value-changed">
     <div class="firstpageheading">
        <template if:true={firstPageheading}>
            <p>{firstPageHeading}</p>
            </p>{firstPageHeading2}</p>
        </template>
    </div>

        <template if:true={isregistereduser}>
    <div class="registered-user-message">
         <p>{isRegisteredUser}<a href={signInUrl} onclick={handleSignInClick} class="blue-link">{signInPage}</a>, or <a href="#" onclick={handleCaseSubmission} class="blue-link">{resetYourPassword}</a></p>
        <!--<p>{isRegisteredUser}< onclick={handleCaseSubmission} class="blue-link">{signInPage}</a>, or <a href="#" onclick={handleCaseSubmission} class="blue-link">{resetYourPassword}</a></p>-->
    </div>
</template>

        <template if:true ={isnotvalidcontact}>
            <div class="registration-text">
    <p>{isNotValidContact}</p>
    <p>{isNotValidContact2} <a href="#" onclick={handleCaseSubmission} class="blue-link">{submitACase}</a></p>
            </div>
        </template>

    <!-- <template if:true={isNouser}>
        <div>
            <p>Good news! You are eligible to register.</p>
            <p>Please complete your registration below:</p>
            <p>User: {firstName} {lastName}</p>
            <p>User ID: {schoolEmail}</p>
            <p>Company / School Name : {companySchoolName}</p>

        </div>
    </template> -->

<template if:true={isNouser}>
    <div class="registration-details">
        <p class="registration-heading">{nouser}</p>
        <p class="registration-heading">{isNoUser3}</p>
    </div>    
    <div class="registration-info">
    <div class="registration-row">
        <p class="registration-label">{scc_isNouser4}User </p>
        <p class="registration-value">{firstName} {lastName}</p>
    </div>
    <div class="registration-row">
        <p class="registration-label">{userID}</p>
        <p class="registration-value">{schoolEmail}</p>
    </div>
    <div class="registration-row">
        <p class="registration-label">{companyName}</p>
        <p class="registration-value">{companySchoolName}</p>
    </div>
</div>
</template>

<div class="registration-success">
<template if:true={registredsuccessfull}>
<p class="center-align">{goodNewsRegistered}</p>
<p class="center-align">{registeredSuccessfully}</p>
<div class="user-info">
<p class="text--1"><strong>{userID}</strong> {schoolEmail}</p>
<p class="text-2"><strong>{companyName} </strong> {companySchoolName}</p>
</div>
<div class="center-align">
 <!--   <a href="https://savvas--dev3.sandbox.my.site.com/MySavvasOrders/login" onclick={hadlersignpage}>

<lightning-button label=" Go To Sign In"  variant="brand"></lightning-button>
</a>-->
 <a onclick={handleSignInClick} class="blue-link">
        <lightning-button label="Go To Sign In" variant="brand"></lightning-button>
    </a>
</div>
</template>
</div>

<div>
    <template if:true={isAccesstype}>

       <!-- <div class="slds-m-around_medium">
           <div style="display: inline-flex;margin-top: 15px;">
               <lightning-button alternative-text="Show menu" lable="Accesse type" icon-name={arrowIcon} variant="border" onclick={toggleCheckboxes} ></lightning-button> 
               <h3 style="margin-left: 10px;">{selectAccessType}</h3>
            </div>-->
<div class="container">
        <div class="dropdown-container">
        <div class="dropdown-arrow" onclick={toggleDropdown}>
            ▼
        </div>
        <label class="search-criteria-label">{selectAccessType}</label>
    </div>
            <template if:true={showCheckboxes}>
                <div style="display: inline-flex; align-items: center;">
                <div class="slds-m-bottom_small">{accountWillBeUsedTo}</div>
                
                
        <lightning-checkbox-group name="accessType" options={checkboxOptions} value={selectedcheckboxs} onchange={handleCheckboxChange} ></lightning-checkbox-group>
           </div>
            </template>

        </div>
    
</template>
</div>
            <div class="slds-form_horizontal slds-form slds-grid slds-wrap">
            <template if:true={showFirstNameLastName}>
                <lightning-input label="First Name" value={firstName} disabled={isFirstNameDisabled} required onchange={handleFirstNameInputChange} class="fixed-width-input"></lightning-input>
                <lightning-input label="Last Name" value={lastName} disabled={isLastNameDisabled} required onchange={handleLastNameInputChange} class="fixed-width-input"></lightning-input>
            </template>
            </div>
<div class="slds-form_horizontal slds-form slds-grid slds-wrap">
    <template if:true={showemailzipcode}>
        <lightning-input label="School Email" value={schoolEmail} disabled={isEmailDisabled} required onchange={handleEmailInputChange} class="fixed-width-input"></lightning-input>

        <template if:true={showEmailError}>
            <div class="slds-text-color_error">{emailError}</div>
        </template>
        <lightning-input label="Choose your School or District by entering the institution City or Zip Code below?" id="schoolZipCode" type="text" value={selectedZipCode} placeholder="Enter School Zip Code" disabled={isZipCodeDisabled} required onchange={handleZipCodeChange} pattern="[0-9]*" class="fixed-width-input" ></lightning-input>
        <template if:true={showZipCodeError}>
            <div class="slds-text-color_error zip-code-error">{zipCodeError}</div>
        </template>
    </template>
    
    <template if:true={showSchoolOptions}>
        <template if:false={hideSelectSchool}>
           <div class="slds-form-element slds-m-around_medium mergingspace">
                <div class="slds-form-element__control">
                        <select id="selectSchool" class="slds-select" onchange={handleSchoolSelect}>
                            <option value="" disabled selected>-- Select School --</option>
                            <option value="default">I don't see my school</option>
                            <template for:each={schoolOptions} for:item="school">
                                <option key={school.value} value={school.value}>{school.label}</option>
                            </template>
                        </select>
                </div>
            </div>  
        </template>
    </template>

</div>  

            <template if:true={showSchoolDetails}>
                <div class="info">
    <span class="label">{companyName} </span>
    <span class="detail">{companySchoolName}</span>
</div>
<div class="info">
    <span class="label">{address}</span>
    <span class="detail">
        <b>{street}</b>, {city}, {postalCode}<br/>
        {state}<br/>
        <b>{country}</b>
    </span>
</div>
        </template>
            <!-- Company/school name colour should be black not red class="slds-text-color_error"-->
             <div  class= "testclas" if:true={showSchoolNotFoundError}>
                <div>
                    <p>{companyName}&nbsp; &nbsp; {companySchoolNameNotFoundPlease} <a href="#" onclick={handleCaseSubmission}>{submitACase}</a> {toGetYourSchoolAdded}</p>
                </div>
            </div>
<div class="button-container">
    <div class="centered-buttons">
        <template if:true={isalways}>
            <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>

            <!-- Empty div to create space -->
            <div style="width: 20px;"></div>

            <lightning-button label="Verify" onclick={handleVerify} variant= "brand" disabled={disableVerify} class={verifyBtnClass}></lightning-button>
        </template>
    </div>
</div> 
 
<div>
            <template if:true={isregiter}>
            <lightning-button label="Register" onclick={registerVerify} disabled={isRegistrationEnabled}></lightning-button>
              &nbsp;  
            <lightning-button label="Cancel" onclick={RegisterCancel}></lightning-button>
            </template>
</div>
    <template if:true={showPopup}>
        <div class="backdrop"></div>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">
                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{placeOrderConfirmation}</h2>
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleClose}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close"></lightning-icon>
                    </button>
                </header>
                <!-- Modal Content -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <p>{pleaseConfirmAuthorization}</p>
                </div>
                <!-- Modal Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={PopupCancel} variant="neutral"></lightning-button>
                    <lightning-button label="Confirm" onclick={PlaceorderConfirm} variant="brand"></lightning-button>
                </footer>
            </div> 
        </section>
    </template>
     </div>
    </lightning-card>
  </div>
 
</template>
