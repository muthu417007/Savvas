<template>
	<div class="slds-grid slds-grid_vertical">
		<p>{addSelectedToCart}</p>
		<!-- Page Navigation Buttons -->
		<div class="slds-align_absolute-center slds-m-bottom_large">
			<lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First"
				class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage}></lightning-button>
			<lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous"
				alternative-text="Previous" onclick={previousPage}>
			</lightning-button>
			&nbsp;
			<span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
			&nbsp;
			<lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next"
				alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right">
			</lightning-button>
			<lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last"
				alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>

			<!-- <div class="slds-col slds-size_3-of-12 ">
				<div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center">
					{displayedRecords} of {totalRecords} Items &nbsp;
					<button class="slds-button slds-button_icon" onmouseover={togglePasswordHint} onmouseout={togglePasswordHint}>
														<lightning-icon icon-name="utility:info" alternative-text="Info" size="xx-small" title=""></lightning-icon>
														</button>
					<div class={taskTypeHelpTextClass} role="tooltip" id="help"
						style="position:absolute;top:194px;right:43px;width:250px;background-color:#504c6e!important;">
						<div class="slds-popover_body">
							<ul class="slds-list_dotted slds-has-dividers_around-space "
								style="color:white !important;padding-top:5px !important;">
								Search by <b>ISBN, Keyword</b>
							</ul>
						</div>
					</div>
				</div>
			</div> -->
		</div>


		<!-- Data Table -->
		<div class="slds-grid slds-grid_vertical">
			<div class="slds-col">
				<div class="slds-scrollable" style="height: 300px;">
					<div class="slds-m-around_small">
						<table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
							<thead>
								<tr class="slds-line-height_reset">
									<!--	<th scope="col">
										<div class="slds-truncate" title=""></div>
									</th> -->
									<th scope="col" width="10px">
										<!-- <div class="slds-truncate" title="Quantity">Quantity</div> -->
										<div class="header-cell">
											<span>Quantity</span>
											<div class="divider"></div>
											<i class="arrow down"></i>
										</div>
									</th>
									<th scope="col">
										<!-- <div class="slds-truncate" title="ISBN">ISBN</div> -->
										<div class="header-cell">
											<span>ISBN</span>
											<div class="divider"></div>
											<i class="arrow down"></i>
										</div>
									</th>
									<th scope="col">
										<!-- <div class="slds-truncate" title="Title Description">Title
											Description</div> -->
										<div class="header-cell">
											<span>Title Description</span>
											<div class="divider"></div>
											<i class="arrow down"></i>
										</div>
									</th>
									<th scope="col">
										<!-- <div class="slds-truncate" title="Type">Type</div> -->
										<div class="header-cell">
											<span>Type</span>
											<div class="divider"></div>
											<i class="arrow down"></i>
										</div>
									</th>
									<th scope="col">
										<!-- <div class="slds-truncate" title="Grade Level">Grade Level</div> -->
										<div class="header-cell">
											<span>Grade Level</span>
											<div class="divider"></div>
											<i class="arrow down"></i>
										</div>
									</th>
									<th scope="col">
										<!-- <div class="slds-truncate" title="Copyright">Copyright</div> -->
										<div class="header-cell">
											<span>Copyright</span>
											<div class="divider"></div>
											<i class="arrow down"></i>
										</div>
									</th>
									<th scope="col">
										<!-- <div class="slds-truncate" title="Status">Status</div> -->
										<div class="header-cell">
											<span>Status</span>
											<div class="divider"></div>
											<i class="arrow down"></i>
										</div>
									</th>
									<th scope="col">
										<!-- <div class="slds-truncate" title="Price">Price</div> -->
										<div class="header-cell">
											<span>Price</span>
											<div class="divider"></div>
											<i class="arrow down"></i>
										</div>
									</th>
								</tr>
							</thead>
							<tbody>
								<!-- Iterate over productData to populate table rows -->
								<template for:each={transformedChildTableData1} for:item="product">
									<tr key={product.productDetails.Id}>
										<!--	<td data-label="">
											<template if:false={product.hideCheckbox}>
												<lightning-input type="checkbox"
													data-row-id={product.productDetails.productId}
													disabled={product.productDetails.disableCheckbox}
													data-field-name="checkbox" onchange={tableRowAction}
													checked={product.checkboxValue}>
												</lightning-input>
											</template>
										</td> -->
										<!-- Quantity Column -->
										<td data-label="Quantity">
											<input type="number" data-row-id={product.productDetails.productId}
															data-attribute-name={product.productDetails.ISBN}
															data-attribute-price={product.productDetails.Price}
                                                            value={product.quantity} onchange={tableRowAction}
															oninput={tableRowAction} onfocus = {handleFocus}
                                                             data-field-name="quantityCount" id="quantity" name="quantity" min="0"
                                                              disabled={isQuantityDisabled}
															>
														</td>
										<td data-label="ISBN">
											<div class="slds-truncate">
												<lightning-button variant="base" data-field-name="isbnId"
													label={product.productDetails.ISBN}
													data-row-id={product.productDetails.productId}
													title={product.productDetails.ISBN} onclick={tableRowAction}>
												</lightning-button>
											</div>
										</td>
										<td data-label="Title Description">
											<div class="slds-truncate" title={product.productDetails.Title_Description}>
												{product.productDetails.Title_Description}</div>
										</td>
										<td data-label="Type">
											<div class="slds-truncate" title={product.productDetails.Type}>
												{product.productDetails.Type}</div>
										</td>
										<td data-label="Grade Level">
											<div class="slds-truncate" title={product.productDetails.Grade_Level}>
												{product.productDetails.Grade_Level}</div>
										</td>
										<td data-label="Copyright">
											<div class="slds-truncate" title={product.productDetails.Copyright}>
												{product.productDetails.Copyright}</div>
										</td>
										<td data-label="Status">
											<div class="slds-truncate" title={product.productDetails.Status}>
												{product.productDetails.Status}</div>
										</td>
										<template if:false={priceLoaded}>
											<td data-label="Price">
												<lightning-button-icon data-product-id={product.productDetails.Id}
													icon-name="utility:hourglass" variant="border-filled"
													alternative-text="Info" size="small" onclick={handlePriceInfo}>
												</lightning-button-icon>
											</td>
										</template>
										<template if:true={priceLoaded}>
											<td data-label="Price">
												<div class="slds-truncate" title={product.productDetails.Status}>
													{product.productDetails.Price}</div>
											</td>
										</template>
									</tr>
								</template>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>
	<template if:true={callAddItemToCart}>
		<c-scc_add-items-to-cart message={itemsList} onreveiewcartcount={handleReviewCartCount} userselection={userInputs} >
		</c-scc_add-items-to-cart>
	</template>
	<template if:true={reviewCartPage}>
		<c-scc_review-cart-page> </c-scc_review-cart-page>
	</template>
	<template if:true={clearCartItems}>
		<c-scc_delete-items-from-cart onrefreshevent={handlerefreshevent}> </c-scc_delete-items-from-cart>
	</template>
</template>
