<!-- /*
********************************************************
  Component Name       : scc_productTable
  Created Date         : 06/10/2024  
  Author               : Cognizant 
  Description          : Data table component for displaying product information with search, sort, filter, 
                        and pricing functionality
  Modifications Log
  06/10/2024      Jaba           Initial Version
********************************************************
*/ -->
<template>
	<div class="slds-m-top_x-small">
		<div class="slds-grid slds-wrap slds-p-horizontal_medium">
			<div class="slds-col slds-size_3-of-3 slds-form slds-p-vertical_x-small">
				<div class="slds-grid slds-wrap slds-p-bottom_xx-small">
					<!-- First column - Pagination -->
					<div class="slds-col slds-size_2-of-5 slds-p-horizontal_none">
						<div class="slds-form-element__control" style="display:flex;margin-left: -10px;">
							<button class="slds-button table-control-button" disabled={bDisableFirst} onclick={firstPage}>&#60;&#60; First</button>
							<button class="slds-button table-control-button" disabled={bDisableFirst} onclick={previousPage}>&#60; Previous</button>
							<p class="page-count-shown slds-m-horizontal_x-small" role="alert">Showing {pageNumber} of
								{totalPages} Pages</p>
							<button class="slds-button table-control-button" disabled={bDisableLast} onclick={nextPage}>Next &#62;</button>
							<button class="slds-button table-control-button" disabled={bDisableLast} onclick={lastPage}>Last &#62;&#62;</button>
						</div>
					</div>

					<!-- Middle column - State Filter -->
					<div class="slds-col slds-size_1-of-5 slds-p-horizontal_none">
						<div class="slds-form-element__control" style="padding-top: 10px">
							<div class="filterSearch">
								<div class="slds-form-element">
									<div class="slds-form-element__control">
										<div class="slds-checkbox">
											<input type="checkbox" name="options" id="checkbox-unique-id-84" value="checkbox-unique-id-84" 
											checked={showNationalAndStateFilter} onchange={handleNationalAndStateFilterChange} />
											<label class="slds-checkbox__label" for="checkbox-unique-id-84">
											<span class="slds-checkbox_faux"></span>
											<span>National AND my State(s)</span>
											</label>
										</div>
									</div>
								</div>

								<div class="slds-is-relative slds-show_inline-block slds-m-left_xx-small"
									style="margin-top: 5px; margin-bottom: auto; bottom: 5px; margin-left: -17px;">
									<div
										class="slds-show_inline-block info-icon slds-m-right_xx-small slds-text-align_center">
										i</div>
									<div class="slds-popover slds-popover_tooltip slds-nubbin_bottom filter-popup"
										role="tooltip" id="7">
										<div class="slds-popover__body">{labels.scc_stateFilterMessage}</div>
									</div>
								</div>
							</div>

						</div>
					</div>

					<!-- Last column - Filter Results -->
					<div class="slds-col slds-size_2-of-5 slds-p-horizontal_none"
						style="display: flex; align-items: end; justify-content: flex-end;">
						<label class="filterSearch" for="filter-search-input">
                Filter Results &nbsp;
                <span class="slds-assistive-text">Enter a keyword to filter within the current set of search results. Showing {transformedDataLength} of {totalCount} Items. {message}</span>
            </label>
						<div class="slds-is-relative slds-show_inline-block slds-m-left_xx-small"
							style="margin-top: auto; margin-bottom: auto; bottom: 5px;">
							<div class="slds-show_inline-block info-icon slds-m-right_xx-small slds-text-align_center">i
							</div>
							<div class="slds-popover slds-popover_tooltip slds-nubbin_bottom filter-popup"
								role="tooltip" id="2">
								<div class="slds-popover__body">Enter a keyword to filter within the current set of
									search results</div>
							</div>
						</div>
						<div class="slds-form-element" style="margin-top: -4px; margin-left: 20px;">
							<div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_right">
								<input type="search" id="filter-search-input" class="filterInput" value={filterSearchValue} oninput={handleFilter} />
								<button class="slds-button slds-button_icon slds-input__icon slds-input__icon_right" title="Clear" onkeydown={handleFilterKeydown}>
                        <img src={crossIconUrl} alt="cross" style="width: 11.88px; height: 11.88px; margin-left: -0.5px; margin-top: 7px;" onclick={clearFilterInput} />
                        <span class="slds-assistive-text">Clear</span>
                    </button>
							</div>
						</div>
						<div style="display: flex; margin-top: 5px; margin-bottom: auto; position: relative;">
							<div class="countItems" role="alert">{transformedDataLength} of {totalCount} Items &nbsp;
							</div>
							<img src={infoIconUrl} alt="info" onmouseover={togglePasswordHintCount} onmouseout={togglePasswordHintCount} style="margin-top: 9px"/>
							<span class="slds-assistive-text">Help</span>
							<div class={taskTypeHelpTextClassCount} role="tooltip" id="help1">
								<div class="slds-popover__body">{message}</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<table aria-label="Search Results">
				<thead>
					<tr class="table-head" style="background-color: #ffff">
						<td class="slds-is-sortable slds-cell_action-mode">
							<div style="display: flex; justify-content: space-between; align-items: center;max-height: 30px;"
								tabindex="0">
								<div>
									ISBN
								</div>
								<div class="thBorder">
								</div>
							</div>
						</td>
						<td class="slds-is-sortable slds-cell_action-mode" style="width: 500px">
							<div style="display: flex; justify-content: space-between; align-items: center; max-height: 30px;"
								tabindex="0">
								<div>
									Title Description
								</div>
								<div class="thBorder">
								</div>
							</div>
						</td>
						<td class="slds-is-sortable slds-cell_action-mode">
							<div style="display: flex; justify-content: space-between; align-items: center; max-height: 30px;"
								tabindex="0">
								<div>
									Type
								</div>
								<div class="thBorder">
								</div>
							</div>
						</td>
						<td class="slds-is-sortable slds-cell_action-mode">
							<div style="display: flex; justify-content: space-between; align-items: center; max-height: 30px;"
								tabindex="0">
								<div>
									Grade
								</div>
								<div class="thBorder">
								</div>
							</div>
						</td>
						<td class="slds-is-sortable slds-cell_action-mode">
							<div style="display: flex; justify-content: space-between; align-items: center; max-height: 30px;"
								tabindex="0">
								<div>©</div>
								<div class="thBorder">
								</div>
							</div>
						</td>
						<td class="slds-is-sortable slds-cell_action-mode">
							<div style="display: flex; justify-content: space-between; align-items: center; max-height: 30px;"
								tabindex="0">
								<div>Status</div>
								<div class="thBorder">
								</div>
							</div>
						</td>
						<td class="slds-is-sortable slds-cell_action-mode">
							<div style="display: flex; justify-content: space-between; align-items: center; max-height: 30px;"
								tabindex="0">
								<div>Price</div>
								<div>
								</div>
							</div>
						</td>
					</tr>
				</thead>
				<tbody class="table-body">
					<template for:each={transformedChildTableData} for:item="row">
						<tr key={row.productId}>
							<td>
								<a href="#" style="color: var(--links, #2150A3); text-decoration: underline;"
									data-row-id={row.productId} title={row.ISBN} onclick={handleRowAction}>
									{row.ISBN}</a>
							</td>
							<td style="width: 500px;">{row.Title_Description}</td>
							<td>{row.Type}</td>
							<td>{row.Grade_Level}</td>
							<td>{row.Copyright}</td>
							<td>{row.Status}</td>
							<td>
								<template if:true={priceLoaded}>
									${row.Price}
								</template>
								<template if:false={priceLoaded}>
									<div class="loader"></div>
								</template>
							</td>
						</tr>
					</template>
				</tbody>
			</table>
		</div>
	</div>
</template>
