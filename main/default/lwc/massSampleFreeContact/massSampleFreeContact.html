<template>
	<div class="spinner">
        <template if:true={isLoading}>
             <lightning-spinner alternative-text="Loading" variant="brand" size="large" class="slds-is-fixed">
             </lightning-spinner>
        </template>
    </div>
	<lightning-card title="Mass Sample/Free Contacts">
			<div class="slds-col slds-text-align_center">
					<lightning-button label="New Mass Sample/Free Contact" onclick={handleSampleCreate}></lightning-button>
					<div class="divider">
					</div>
					<lightning-button label="Add Contact from List" onclick={addContactFromList}></lightning-button>
			</div>
			<div class="slds-m-around_medium slds-text-body_small overflow-x: auto myUniqueTable">
					<template if:true={showTable}>
						<lightning-datatable
							data={recordList}
							columns={columnsVal}
							key-field="nameLink"
							onrowaction={handleRowAction}
							hide-checkbox-column="true"  >
						</lightning-datatable>
					</template>
					<template if:true={noData}>
						{noData}
					</template>
					<template if:true={fetchError}>
						{fetchError}
					</template>
			</div>	
	</lightning-card>
	<!--<c-custom-lookup-comp if:true={showSampleCreate} parent-id ={parentSampleId}></c-custom-lookup-comp>-->
	<template if:true={showSampleCreate}>
		<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
			<div class="slds-modal__container">
					<!--Modal/Popup Box LWC header here -->
					<header class="slds-modal__header">
						<h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">New Mass Sample/Free Contact</h2>
				</header>
				<!--Modal/Popup Box LWC body starts here -->
				<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1"  onclick={ignore}>
					<div class="slds-col slds-size_8-of-12 slds-p-horizontal_medium" >										
						<c-custom-lookup-comp 
						 icon-name="standard:account"
						 obj-name = "Account"
                         label="Account"
						 selected-name={accVal}
						 is-value-selected= {isUpdate}
						 onlookupselected={handleAccountSelection}
						 outside-click={outsideClick}
						 query-fields="Account_Name_City_State__c"
						 placeholder="Search Accounts..."></c-custom-lookup-comp>
					</div>
					<div class="slds-col slds-size_8-of-12 slds-p-horizontal_medium">										
						<c-custom-lookup-comp 
						 icon-name="standard:contact"
						 obj-name = "Contact"
                         label="Contact"
						 selected-name={contactVal}
						 is-value-selected= {isUpdate}
						 onlookupselected={handleContactSelection}
						 filter={selectedAccId}
						 related-field="AccountId"
						 query-fields="Account.Name"
						 outside-click={outsideClick}
						 required-flag = false;
						 placeholder="Search Contacts..."></c-custom-lookup-comp>
					</div>
					<div class="slds-col slds-size_8-of-12 slds-p-horizontal_medium slds-modal__content">
					 <template if:true={currencyPicklistValues.data}>
						 <lightning-combobox
							 name="types"
							 label="Currency"
							 value={currencyValue}
							 options={currencyPicklistValues.data.values}
							 onchange={handleCurrencySelection}
							 >
						 </lightning-combobox> 
				 </template>
				</div>
				   <div class="slds-col slds-size_8-of-12 slds-p-horizontal_medium">
						<label class="slds-form-element__label" for="combobox-id-1">Back to Mass Sample/Free</label>
						<div id="lookup-pill" class="slds-pill_container">
							<lightning-pill class="pillSize" label={massSampleName} name={massSampleName} required=true>
								<lightning-icon icon-name="standard:default" ></lightning-icon>
							</lightning-pill>
						</div>
			   		</div>
				</div>
				<footer class="slds-modal__footer">
					<div class="slds-col slds-text-align_center">
						<lightning-button type="cancel" label="Cancel" onclick={handleCancel}></lightning-button>
						<div class="divider"></div>
					<lightning-button type="submit" label="Save" variant="brand" onclick={handleSubmit}></lightning-button>
					</div>
				</footer>
				
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>
	</template>
</template>
