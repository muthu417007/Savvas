<template>
    <lightning-card title="Update Service Appointment">
        <div class="slds-m-around_medium">
            <lightning-input type="datetime" label="Start Time" value={startTime} onchange={handleStartTimeChange}></lightning-input>
            <lightning-input type="datetime" label="End Time" value={endTime} onchange={handleEndTimeChange}></lightning-input>
            <lightning-button variant="brand" label="Update" onclick={updateRecord}></lightning-button>
        </div>
    </lightning-card>
</template>
