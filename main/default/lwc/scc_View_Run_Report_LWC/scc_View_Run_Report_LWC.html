<template>
 
<template if:true={isLoading}>

                    <div class="slds-spinner__dot-b"></div>
                </div>
            </div>
        </div>
    </template>
    <template if:true={OrderStatusReport}>

		<div class="slds-col">
			<nav role="navigation" aria-label="Breadcrumbs">
				<ol class="slds-breadcrumb slds-list_horizontal slds-wrap">
					<li class="slds-breadcrumb__item">
						<a href="#" class="slds-m-right_small breadcrumb-label first-breadcrumb">Home</a>
					</li>
                  <li class="slds-breadcrumb__item">
						<a href="#" class="slds-m-right_small breadcrumb-label">Reports</a>
					</li>
                      <template if:false={isdetailedopen}>
					<li class="slds-breadcrumb__item">
						<a class="slds-m-left_small slds-text-title_bold breadcrumb-label">ViewSample</a>
					</li>
                      </template>
                          <template if:true={isdetailedopen}>
					<li class="slds-breadcrumb__item">
						<a class="slds-m-left_small slds-text-title_bold breadcrumb-label" >Report Detail</a>
					</li>
                      </template>

				<!-- <button class="slds-button  delete-report" onclick={deletereporthander} disabled={deletereportDisabled}>Delete Report</button> -->
				<button class="slds-button  edit-criteria" onclick={editCriteriaHander} aria-disabled={editcriteriaDisabled}>Edit Criteria</button>
				<button class="slds-button  run-report" onclick={runreporthander} aria-disabled={runreportDisabled}>Run Report</button>
			</div>
		</div>
    </template>

    <template if:true={showEmailReportPopup}>

				<div class="slds-modal__container" style="max-width: 668px">
					<!------HEADER Section-->
					<div class="slds-modal__header">
						<button class="slds-modal__close closebtnOnFocus emailRprtCloseBtn" onclick={closeEmailReportModal} onfocusout={focusOutClose} aria-label="close" data-id="closeButton">x</button>
						<h3 role="heading" aria-level="2">Email Report</h3>
					</div>
					<!------Body Section-->
					<div class="slds-modal__content slds-p-around_medium ">

                                <div style="position:relative;  height:120px;">

                                </div>
                            <!-- </div> -->
                        </template>
                        <template if:false={isLoading}>

                                <div>

                                    <div class="slds-text-color_error" style="padding-top: 5px; font-size: 14px;">{errorMessage}</div>
                                </template>
                                </div>
                                
                            </div>
                        </template>
                        
					</div>
                    <!------Footer Section-->
					<div class="slds-modal__footer slds-p-bottom_medium">
                        <div>
                            <button class="slds-button clear-cart-modal-button " onclick={emailHandler} onkeypress={emailHandler} aria-disabled={isDisabled} data-index="0" ><span><img src={emailIcon} alt="emailIcon" class="email-icon"/></span> Email Report</button>
                        </div>
                        <div>
                            <a tabindex="0" class="cancel-modal-button" role="button" onclick={closeEmailReportModal} onfocusout={focusOutButton}>Cancel</a>
                        </div>
					</div>
					
				</div>
			</div>
    </template>


<!--Displaying report name and discription (added by zubiya) -->
