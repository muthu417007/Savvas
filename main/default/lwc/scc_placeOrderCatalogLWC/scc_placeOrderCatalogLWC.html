<template>
	<template if:true={showcatalog}>
		<div class="slds-grid slds-wrap">
			<div class="slds-col slds-col-size_3-of-3">
				<div class="catalogue-wrapper slds-p-top_large">
					<h2 class="slds-p-horizontal_x-large slds-is-relative catalogue-title">Catalog Search</h2>
					<nav role="navigation" aria-label="Breadcrumbs">
						<div class="slds-breadcrumb slds-list_horizontal slds-wrap slds-p-horizontal_x-large">
							<template for:each={breadcrumbs} for:item="breadcrumb" for:index="index">
								<a key={breadcrumb.url} href={breadcrumb.url} data-index={index}
									onclick={handleBreadcrumbClick}>{breadcrumb.label}</a>
							</template>
						</div>
					</nav>
					<div class="slds-grid slds-wrap slds-grid_align-end">
						<div class="slds-col">
							<div class="filter-details slds-p-horizontal_large slds-p-vertical_medium">
								<button class="slds-button slds-m-right_small add-to-cart" onclick={addSelectedToCartHandleClick} aria-disabled={addSelectedToCartBtnDisabled}>{addToCartButtonLabel}</button>
								<button class="slds-button slds-m-right_small clear-cart" onclick={clearCartHandleClick} aria-disabled={clearCartBtnDisabled}>{clearCartButtonLabel}</button>
								<button class="slds-button slds-m-right_small review-cart" onclick={reviewCartHandleClick} aria-disabled={reviewCartDisabled}>
									<img class="slds-m-right_xx-small cart-blue" src={labels.scc_checkout_cart} alt="cart icon" />
									<img class="slds-m-right_xx-small cart-white" src={labels.scc_checkout_cart_white} alt="cart icon" />
									{reviewCartButtonLabel}
								</button>
								<label class="slds-form-element__label" for="filter-search-input">Filter Results &nbsp;<span class="slds-assistive-text">Showing {transformedDataLength} of {totalCount} Items, Use panel on the left to navigate through the catalog</span></label>
								<div class="slds-is-relative">
									<input type="text" id="filter-search-input" class="slds-input filter-search-input placeOrdercatalogFilter" value={filterSearchValue} onchange={handleFilter} onkeyup={handleFilter} />
									<button class="slds-button filter-clear" onclick={clearFilterInput} aria-label="Close">x</button>
								</div>
								<div class="slds-form-element__label item-count">{transformedDataLength} of {totalCount}
									Items</div>
								<div class="slds-is-relative slds-show_inline-block slds-m-left_x-small">
									<div class="slds-show_inline-block info-icon slds-text-align_center">i</div>
									<div class="slds-popover slds-popover_tooltip slds-nubbin_bottom-right"
										role="tooltip" id="5">
										<div class="slds-popover__body">Use panel on the left to navigate through the
											catalog</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<template lwc:if={displayProductCategoryData}>
						<div class={menuClass}>
							<div
								class="slds-grid slds-wrap slds-p-left_x-large slds-p-right_none slds-p-vertical_medium">
								<div class="slds-col slds-size_11-of-12 ">
									<div>
										<h2 class="slds-show_inline-block">Catalog</h2>
										<button class="slds-button slds-float_right slds-m-right_x-large" onclick={resetSelection}>Reset</button>
									</div>
									<div class="catalog-panel-list-wrapper">
										<div class="catalog-panel-list">
											<lightning-tree items={searchMenuData} selected-item={selectedItem}
												onselect={handleOnSelect}></lightning-tree>
										</div>
									</div>
								</div>
								<div class="slds-col slds-size_1-of-12 slds-align-middle catalog-expand-collapse-btn">
									<template if:true={showSideMenu}>
										<div class="toggle-panel-button">
											<div class="slds-is-relative slds-show_inline-block slds-m-left_xx-small">
												<lightning-icon icon-name='utility:chevronleft'
													alternative-text='chevronleft, Click to collapse Panel' size='large'
													onclick={toggleMenu} tabindex="0" role="button"
													aria-label="Click to collapse Panel" onkeydown={handleKeyPress}>
												</lightning-icon>
												<div class="slds-popover slds-popover_tooltip slds-nubbin_bottom"
													role="tooltip" id="12">
													<div class="slds-popover__body">Click to collapse Panel</div>
												</div>
											</div>
										</div>
									</template>
									<template if:false={showSideMenu}>
										<div class="toggle-panel-button">
											<div class="slds-is-relative slds-show_inline-block slds-m-left_xx-small">
												<lightning-icon icon-name='utility:chevronright'
													alternative-text='chevronright, Click to expand Panel' size='large'
													onclick={toggleMenu} tabindex="0" role="button"
													aria-label="Click to expand Panel" onkeydown={handleKeyPress}>
												</lightning-icon>
												<div class="slds-popover slds-popover_tooltip slds-nubbin_bottom-left"
													role="tooltip" id="11">
													<div class="slds-popover__body">Click to expand Panel</div>
												</div>
											</div>
										</div>
									</template>
								</div>
							</div>
						</div>
					</template>
					<template if:false={noData}>
						<c-scc_placeorder-catalog-table-l-w-c raw-parent-table-data={productQuantityData}
							onshowproducttitlepage={openChildTitlePage} check-active-id={activeCartId}
							onquantitychange={handleQuantityChange} add-selected-to-cart={addToCart}
							onreveiewcartcount={handleReviewCartCount} onresetaddtocart={handleresetaddtocart}
							userselection={userInputs} ontransformeddatalength={handleTransformedDataLength}
							filter={filterCriteria} onsearchresultsavailable={handleSearchResultsAvailable}>
						</c-scc_placeorder-catalog-table-l-w-c>
					</template>
				</div>
			</div>
		</div>
		<template if:true={isLoading}>
			<!-- Show loading spinner -->
			<div class="spinner-wrapper slds-spinner_container" style="height: 200px; position:absolute;">
				<div class="slds-backdrop slds-backdrop_open">
					<lightning-spinner size="medium" variant="brand" alternative-text="Loading"></lightning-spinner>
				</div>
			</div>
		</template>
	</template>
	<!--Clear cart model-->
	<template if:true={isModalOpen}>
		<!-- Modal/Popup Box LWC starts here -->
		<div class="slds-modal slds-fade-in-open slds-backdrop" role="dialog">
			<div class="slds-modal__container">
				<!------HEADER Section-->
				<div class="slds-modal__header">
					<button class="slds-modal__close closebtnOnFocus emailRprtCloseBtn" onclick={closeModal} onfocusout={focusOutClose} aria-label="close" data-id="closeButton">x</button>
					<h2>Clear cart</h2>
				</div>
				<!------Body Section-->
				<div class="slds-modal__content slds-p-around_medium">
					<div class="slds-form_horizontal slds-text-align_center">
						<p> Are you sure you want to clear all items from this Cart?</p>
						<div class="slds-show_inline-block note-icon slds-m-right_xx-small" role="alert">!</div>
						<span>This action cannot be undone</span>
					</div>
				</div>
				<!------Footer Section-->
				<div class="slds-modal__footer">
					<button class="slds-button clear-cart-modal-button" data-index="0" onclick={handleClearCart}>Clear Cart</button>
					<button class="slds-button cancel-modal-button" tabindex="0" onclick={handleCancel} onfocusout={focusOutButton}>Cancel</button>
				</div>
			</div>
		</div>
	</template>
	<template if:true={clearCartItems}>
		<c-scc_delete-items-from-cart onrefreshevent={handlerefreshevent}> </c-scc_delete-items-from-cart>
	</template>
	<template if:true={reviewCartPage}>
		<c-scc_review-cart-page userselection={userInputs}> </c-scc_review-cart-page>
	</template>
</template>
