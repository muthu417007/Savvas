<script>
    document.addEventListener("DOMContentLoaded", function(event) {
        setTimeout(function(){
        	headerTabActive();
            /* add id and roles for different regions for accessibility*/
            if(document.querySelector(".content") != undefined){
                document.querySelector(".content").setAttribute("id", "body-content");
                document.querySelector('.content').setAttribute('role', 'main');
            }
            if(document.querySelector('.mysavvasorder-footer') != undefined){
            	document.querySelector('.mysavvasorder-footer').setAttribute('role', 'contentinfo');
                document.querySelector('.mysavvasorder-footer').setAttribute('aria-label', 'Copyright © 2024 Savvas Learning Company LLC. All Rights Reserved');
            }
            var imageRole = document.querySelectorAll('[role=img]');
            if(imageRole){
                for(i=0;i<imageRole.length;i++){
                    imageRole[i].removeAttribute("role");
                }
            }
            if(document.querySelector('.dxp-content-layout-site-logo') != undefined){
                document.querySelector('.dxp-content-layout-site-logo').setAttribute('aria-label', 'my Savvas Orders logo');
            }
            }, 5000);
    });
	
	window.navigation.addEventListener("navigate", (event) => {
        setTimeout(function(){
			headerTabActive();
        }, 500);
	})
    
    function headerTabActive(){
        var tabArray = document.querySelectorAll(".header-navigation ul li a");
        for(i=0; i<tabArray.length; i++){
            tabArray[i].classList.remove('active');
        }
        var path = window.location.pathname;
        var page = path.split("/").pop();
        if(page == ""){
            if(document.querySelector(".header-navigation ul li:nth-child(1) a") != undefined){
                document.querySelector(".header-navigation ul li:nth-child(1) a").classList.add('active');
            }
        }else if(page == "order-status"){
            if(document.querySelector(".header-navigation ul li:nth-child(2) a") != undefined){
                document.querySelector(".header-navigation ul li:nth-child(2) a").classList.add('active');
            }
        }else if(page == "price-and-availability"){
            if(document.querySelector(".header-navigation ul li:nth-child(3) a") != undefined){
                document.querySelector(".header-navigation ul li:nth-child(3) a").classList.add('active');
            }
        }else if(page == "place-order"){
            if(document.querySelector(".header-navigation ul li:nth-child(4) a") != undefined && document.querySelector(".header-navigation ul li:nth-child(4) a").innerHTML.toLowerCase() == "place order"){
                document.querySelector(".header-navigation ul li:nth-child(4) a").classList.add('active');
            }
        }else if(page == "reports"){
            if(document.querySelector(".header-navigation ul li:nth-last-child(3) a") != undefined){
                document.querySelector(".header-navigation ul li:nth-last-child(3) a").classList.add('active');
            }
        }else if(page == "documents"){
            if(document.querySelector(".header-navigation ul li:nth-last-child(2) a") != undefined){
                document.querySelector(".header-navigation ul li:nth-last-child(2) a").classList.add('active');
            }
        }else if(page == "access-code"){
            if(document.querySelector(".header-navigation ul li:nth-last-child(1) a") != undefined){
                document.querySelector(".header-navigation ul li:nth-last-child(1) a").classList.add('active');
            }
        }
    }
</script>

<!-- Shadow DOM Analytics solution Example-->
 
<script>
  (function() {
    // Set to the event you want to track
      var eventName = 'placeorderdata';
    //var eventName = 'click',
    // Set to false if you don't want to use capture phase
        useCapture = true,
    // Set to false if you want to track all events and not just those in shadow DOM
        trackOnlyShadowDom = true;
 
    var callback = function(event) {
      if ('composed' in event && typeof event.composedPath === 'function') {
        // Get the path of elements the event climbed through, e.g.
        // [span, div, div, section, body]
        var path = event.composedPath();
          console.log("path ",path);
        // Fetch reference to the element that was actually clicked
        var targetElement = path[0];
        // Check if the element is WITHIN the shadow DOM (ignoring the root)
        var shadowFound = path.length ? path.filter(function(i) {
          return !targetElement.shadowRoot && !!i.shadowRoot;
        }).length > 0 : false;
        // If only shadow DOM events should be tracked and the element is not within one, return
        //if (trackOnlyShadowDom && !shadowFound) return;
        // Push to dataLayer
        if(shadowFound) {
            window.dataLayer.push({
                event: "placeorderdata",
 
                'gtm.element': targetElement,
                'gtm.elementClasses': targetElement.className || '',
                'gtm.elementId': targetElement.id || '',
                'gtm.elementTarget': targetElement.target || '',
                'gtm.elementUrl': targetElement.href || targetElement.action || '',
                inShadowDom: shadowFound
 
            });
        } else {
            for(let i=0;i< window.dataLayer.length;i++){
                if(window.dataLayer[i].event==="placeorderdata"){
                    window.dataLayer.splice(i,1);
                }
            }
            
            window.dataLayer.push({
                cart:event.detail.cart,
                form:event.detail.form,
                institution:event.detail.institution,
                page: event.detail.page,
                pmdb: event.detail.pmdb,
                products: event.detail.products,
                program: event.detail.program,
                site: event.detail.site,
                event: "placeorderdata",
                inShadowDom: shadowFound
            });
        }
      }
    };
    document.addEventListener(eventName, callback, useCapture);
  })();
</script>
