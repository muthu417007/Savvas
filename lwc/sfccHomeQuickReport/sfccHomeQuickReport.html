<template>
    <lightning-card>
        <div class="slds-m-top_large">
            <h4 class="slds-text-heading_medium slds-m-horizontal_small recent-order form-title">Quick Report</h4>
        </div>
        <div class="slds-form">
            <div class="slds-form-element slds-m-horizontal_small">
                <label for="FieldSelect" class="slds-form-element__label slds-no-flex form-label">
                   Report
                </label>    
                <div class="slds-form-element__control">
                    <select style="padding: 5px;" class="slds-select input-wrapper" name = "optionSelect" onchange={changeHandler} >
                        <template for:each={quickReportOptions} for:item="option">
                            <option key={option.value} value={option.value}>{option.label}</option>
                        </template>
                    </select>
                </div>
            </div>
            <div class="slds-form-element slds-m-horizontal_small">
                <label for="FieldSelect" class="slds-form-element__label slds-no-flex form-label">
                   Delivery Method
                </label>
                <div class="slds-form-element__control">
                    <input type="text" data-id="inputUsername" data-name="inputUsername" placeholder="PO #" class="slds-input input-wrapper " onchange={handleUserNameChange} onkeyup={handleUserNameChange} required />
                </div>
            </div>
            <div class="slds-form-element slds-m-horizontal_small">
                <label for="FieldSelect" class="slds-form-element__label slds-no-flex form-label">
                    Email 
                </label>
                <div class="slds-form-element__control">
                    <input type="text" data-id="inputUsername" data-name="inputUsername" placeholder="ISBN" class="slds-input input-wrapper " onchange={handleUserNameChange} onkeyup={handleUserNameChange} required />
                </div>
            </div>
            
              <div class="slds-form-element__control slds-m-around_small">
                <button class="slds-button slds-button_icon slds-button_icon-brand btn" title="Search">
                    <div>
                        <lightning-icon class="chevron-icon slds-m-right_x-small" icon-name="utility:search" size="small" alternative-text="Search" aria-hidden="true"></lightning-icon>
                    </div>
                    <span>Submit</span> 
                </button>
                 
            </div>
        </div>
    </lightning-card>
</template>
