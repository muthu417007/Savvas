<template>
    <!-- Conditional rendering based on showTabset variable -->
     <div lwc:if={showTabset}> 
        <!-- Breadcrumbs -->
        <nav role="navigation" aria-label="Breadcrumbs">
            <ol class="slds-breadcrumb slds-list_horizontal slds-wrap">
                <!-- Breadcrumb item for Price & Availability -->
                <li class="slds-breadcrumb__item slds-p-horizontal_x-small">
                    Price & Availability
                </li>
                <!-- Breadcrumb item for Product Search -->
                <li class="slds-breadcrumb__item slds-p-horizontal_x-small" style="font-weight: bold;">
                    Product Search
                </li>
            </ol>
        </nav>

        <!-- Lightning Tabset -->
        <lightning-tabset class="custom-tabset" active-tab-value={getactiveTabValue} >
       
            <!-- Tab 1: ISBN/Title -->
            <lightning-tab label="ISBN/Title" class="tabs-coloroverride" onactive={handleActive} value="ISBN" >
                <template if:false={showProductTitlePage}>
                    <div>
                        <!-- Search Buttons -->
                        <div class="slds-grid slds-grid_align-end">
                            <!-- Clear Search Button -->
                            <div class="slds-col">
                                <lightning-button label="Clear Search" onclick={handleClear}
                                    class="slds-m-left_x-small neutral-button-text-color small-button"></lightning-button>
                            </div>
                            <!-- Search Button -->
                            <div class="slds-col">
                                <lightning-button variant="brand" label="Search" disabled={checkInputValues}
                                    onclick={handleSearch} class="slds-m-left_x-small small-button"></lightning-button>
                            </div>
                        </div>

                        <!-- Accordion for Search Criteria -->
                        <div class="slds-box slds-theme_shade slds-p-vertical_xx-small slds-m-vertical_xx-small slds-p-horizontal_none">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <lightning-icon size="xx-small" icon-name="utility:chevrondown"
                                    alternative-text="chevrondown">
                                </lightning-icon>
                                <div>&nbsp;&nbsp;Search Criteria</div>
                            </div>
                        </div>

                        <!-- Criteria Section -->
                        <div class="slds-grid slds-gutters slds-p-horizontal_small slds-grid_vertical-align-end">
                            <!-- ISBN Input -->
                            <div class="slds-col">
                                <lightning-input maxlength="13" label="ISBN" value={isbnValue}
                                    onchange={handleTextInputChange}>
                                </lightning-input>
                            </div>
                            <!-- Title Keyword Input -->
                            <div class="slds-col">
                                <lightning-input label="Title Keyword(s)" value={titlekeyword}
                                    onchange={handleTextInputChange}>
                                </lightning-input>
                            </div>
                            <!-- Active Products Checkbox -->
                            <div class="slds-col slds-align-middle slds-p-top_small">
                                <div class="slds-form-element">
                                    <label class="slds-form-element__label" for="checkbox-unique-id-80">Active Products Only</label>
                                    <div class="slds-form-element__control">
                                        <span class="slds-checkbox slds-checkbox_standalone">
                                            <input type="checkbox" id="checkbox-unique-id-80" name="label" value="option" checked={activeProducts} onchange={handleActiveProductsChange} />
                                            <span class="slds-checkbox_faux"></span>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Accordion for Search Results -->
                    <div class="slds-box slds-theme_shade slds-p-vertical_xx-small slds-m-vertical_xx-small slds-p-horizontal_none">
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <lightning-icon size="xx-small" icon-name="utility:chevrondown"
                                alternative-text="chevrondown">
                            </lightning-icon>
                            <div>&nbsp;&nbsp;Search Results</div>
                        </div>
                    </div>

                    <!-- Search Result Error Message -->
                    <template if:true={showSearchResultErrorMessage}>
                        <p class="slds-p-around_x-small slds-text-body_small slds-text-color_destructive">
                            {searchResultErrorMessage}
                        </p>
                    </template>

                    <!-- Lightning Data Table to display search results -->
                    <template if:true={showResults}>
                        <div class="slds-grid slds-grid_vertical">
                            <!-- Total Records Badge -->
                            <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-top: 0.5em;">
                                <div class="slds-clearfix">
                                    <div class="slds-float_right">
                                        <span class="slds-badge"> {totalRecords} items </span>
                                    </div>
                                </div>
                                <!-- Records Per Page Dropdown -->
                                <div class="slds-col">
                                    <div class="slds-list_inline slds-p-bottom_xx-small">
                                        <label class="slds-text-color_weak slds-p-horizontal_x-small" for="recordsPerPage"># of Rows</label>
                                        <div class="slds-select_container">
                                            <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                                                <template for:each={pageSizeOptions} for:item="option">
                                                    <option key={option} value={option}>{option}</option>
                                                </template>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <!-- Page Navigation Buttons -->
                                <div class="slds-align_absolute-center" style="height:5rem">
                                    <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label="First" class="slds-p-horizontal_x-small" alternative-text="first page" onclick={firstPage}></lightning-button>
                                    <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label="Previous" alternative-text="Previous" onclick={previousPage}></lightning-button>
                                    &nbsp;
                                    <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                                    &nbsp;
                                    <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label="Next" alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_x-small" icon-position="right"></lightning-button>
                                    <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last" alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                                </div>
                            </div>
                                 <div class="slds-form-element__control">
                                    <lightning-input type="search" 
                                                     label="" 
                                                    onchange={handleSearchInputChange}></lightning-input>
                            </div>
                            <!-- Data Table -->
                            <div class="slds-col">
                                <!-- <div class="slds-scrollable" style="height: 300px;"> -->
                                    <div class="slds-m-around_small">
                                        <lightning-datatable data-id="datatable" data={currentPagetableData}
                                            columns={columns} hide-checkbox-column="true" key-field="productId"
                                            onrowaction={handleRowAction} default-sort-direction={defaultSortDirection}
                                            sorted-direction={sortDirection} sorted-by={sortedBy} onsort={onHandleSort}>
                                        </lightning-datatable>
                                    </div>
                                <!-- </div> -->
                            </div>
                        </div>
                    </template>
                </template>
            </lightning-tab>

            <!-- Tab 2: Multi ISBN -->
           <lightning-tab label="Multi ISBN" onactive={handleActive} value="multiISBN" >
                <!-- Custom LWC component for multi ISBN search -->
               <c-testpro 
                parent-selected-product-record={selectedProductRecord} onshowproducttitlepage={handleShowProductTitlePage}
                  >
                </c-testpro>
            </lightning-tab>
        </lightning-tabset>
     </div>

    <!-- Conditional rendering for Product Title Page -->
    <template if:true={showProductTitlePage}>
        <c-scc_product-title-page parent-selected-product-record={selectedProductRecord}
        onclosetitlepage={closeChildTitlePage} tab-value={getactiveTabValue} ></c-scc_product-title-page>
    </template>

    <!-- Placeholder template -->
    <template if:true={variable}>
        
    </template>
</template>
