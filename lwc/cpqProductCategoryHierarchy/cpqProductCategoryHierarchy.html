<template>
    <!-- spinner for CategoryHierarchy-->
    <template if:false={isLoaded}>
        <div class="demo-only demo-only_viewport" style="height:6rem;position:relative">
            <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
            <span class="slds-assistive-text">Loading</span>
            <div class="slds-spinner__dot-a"></div>
            <div class="slds-spinner__dot-b"></div>
            </div>
            </div>
    </template>

    <!-- Loads this element when isLoaded is true -->
    <template if:true={isLoaded}>
        <template if:true={gridData}>
            <div class="slds-p-around_medium">
                <lightning-card variant="Narrow" title={title}>
                    <!-- lightning tree grid drilldown for all categories in Org -->
                    <lightning-tree-grid 
                        columns={gridColumns} 
                        data={gridData} 
                        key-field="Id" 
                        max-column-width="2000"
                        ontoggle={handleRowToggle}
                        onrowselection={getSelectedName}
                    >
                    <!-- NEW removed from tree-grid selected-rows={preselectedRow} -->
                    </lightning-tree-grid>

                    <!-- NEW for feedback 66 - add button-container class tho this div, update CSS file -->
                    <!-- Inserts products and directs user to ProductCart-->
                    <div class="slds-grid slds-grid_align-spread button-container">
                        <div class="slds-col"></div>
                        <div class="slds-col"></div>
                        <div class="slds-col">
                            <div>
                                <!-- NEW moved handleFilterProducts from the onrowselection and assigned it to this button -->
                                <lightning-button label="Clear Selections" title="Clear Selections" onclick={clearSelection}></lightning-button>
                                <lightning-button variant="brand" label="Search Categories" title="Search Categories" onclick={handleFilterProducts}></lightning-button>
                            </div>
                        </div>
                    </div>
                </lightning-card>
            </div>
        </template>
    </template>
    
</template>
