<template>
    <lightning-card>
        <div class="slds-m-top_large">
            <h2 class="slds-text-heading_medium slds-m-horizontal_small recent-order form-title">Quick Reports</h2>
        </div>
        <div
            class="slds-form slds-p-top_large slds-p-horizontal_large search-fields-group slds-show slds-grid slds-wrap">
            <div class="slds-col slds-size_12-of-12">
                <div class="slds-form-element">
                    <lightning-combobox class="statuscombobox" label=Report placeholder="Report" value={SearchByvalue}
                        options={SearchByOptions} onchange={handleSearchOptionChange}>
                    </lightning-combobox>
                </div>
            </div>
        </div>
        <div class="slds-form-element slds-m-horizontal_small">
            <label for="FieldSelect" class="slds-form-element__label" style="padding-left:20px;" aria-label="Delivery Method">
                   Delivery Method
                </label>
                 <div if:true={isLoader}>
                                <div style="position:absolute;  height:120px; left:250px;">
                                    <lightning-spinner alternative-text="Loading" variant="brand" size="medium" ></lightning-spinner>
                                </div>
                        </div>
            <div class="slds-form-element__control">
                <span class="slds-radio">
				      <input type="radio" id="radio-61" value="radio-61" name="default" onclick={handleRadio1}   />
				      <label class="slds-radio__label" for="radio-61">
				        <span class="slds-radio_faux"></span>
                <span class="slds-form-element__label"><div class="slds-assistive-text">Delivery Method</div>Show on Screen</span>
                </label>
                </span>
                <span class="slds-radio" style="padding-left:35px;">
				      <input type="radio" id="radio-62" value="radio-62" name="default" checked="" onclick={handleRadio2} />
				      <label class="slds-radio__label" for="radio-62">
				        <span class="slds-radio_faux"></span>
                <span class="slds-form-element__label"><div class="slds-assistive-text">Delivery Method</div>Email to</span>
                </label>
                </span>
            </div>

            <div class="slds-form-element slds-m-horizontal_small">
                <label for="FieldSelect1" class="slds-form-element__label slds-no-flex form-label" style="padding-left:5px;">
                    Email <div class="slds-assistive-text">Separate multiple email addresses with commas</div>
                </label>
                <div class="email-text" role="tooltip">Separate multiple email addresses with commas</div>
                <div>
                    <input id="FieldSelect1" type="email" placeholder="Email" value={emailInput} oninput={handleEmailInput}  class="slds-input"/>
                    <template if:true={showErrorMessage}>
                        <div class="slds-text-color_error" style="padding-top: 5px;">{errorMessage}</div>
                    </template>
                </div>
            </div>

            <div class="slds-form-element__control slds-m-around_small">
                <button class="slds-button slds-button_icon search-button" onclick={handleSearch} aria-disabled={handleSearchDisabled}>
                    <span>Run</span> 
                </button>
            </div>
        </div>
    </lightning-card>
</template>
