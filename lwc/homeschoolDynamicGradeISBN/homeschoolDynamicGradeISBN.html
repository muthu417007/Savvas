<template>
    
    <lightning-checkbox-group name="Grade Selection"
                              label="Grade Level(s) of Purchased Program(s)"
                              options={gradeOptions}
                              value={selectedGrades}
                              onchange={handleGradeChange}
                              message-when-value-missing="">
    </lightning-checkbox-group>

                            options={gradeOptions2}
                            value={selectedGrades}
                            onchange={handleGradeChange}
                            message-when-value-missing="">
    </lightning-checkbox-group>-->


    <template for:each={gradeISBNData} for:item="grade">     
    <div class="slds-form-element;slds-text-body_small" key={grade.key}>
            <!--<p style="color: #ff0000;">Selected Values are: <strong>{grade.key}th Grade Product(s) Purchased</strong></p>
            <p style="color: #ff0000;">Selected Values are: <strong>{grade.value}</strong></p>-->
            <lightning-checkbox-group name="ISBN Selection"

     </div>
