<template>
    <template if:true={openModal}>
        <div class="slds-modal slds-fade-in-open slds-backdrop" role="dialog">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <button class="slds-modal__close guestOrderStatusClose" onclick={closeModal} onfocusout={focusOutButton} aria-label="close">x</button>
                    <h3 aria-level="2">Email Invoice</h3>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="form-container">
                        <div class="slds-col slds-size_3-of-3 slds-m-top_medium">
                            <div class="slds-form-element__label">Zip / Postal Code *</div>
                            <div class="slds-p-around_none">
                                <input type="text" aria-label="Zip / Postal Code Required" placeholder="Zip Code" data-id="Zipcode" value={Zipcode} onchange={handleZipChange} onkeyup={handleNumChange} class="slds-input fixed-width-input zipcode-input" data-index="0" name="zip-code"/>
                            </div>
                        </div>
                        <div class="slds-col slds-size_3-of-3 slds-m-top_medium">
                            <div class="slds-form-element__label">Invoice # *</div>

                            <div class="slds-p-around_none">
                                <input type="text" aria-label="Invoice # Required" placeholder="Invoice #" data-id="Invoice" value={Invoice} onchange={handleInvoiceChange} onkeyup={handleNumChange}  class="slds-input fixed-width-input" data-index="0" pattern="[0-9]*" name="invoice"/>
                            </div>
                        </div>
                        <div class="slds-col slds-size_3-of-3 slds-m-top_medium">
                            <div class="slds-form-element__label">Email(s) *</div>
                            <div class="slds-p-around_none">
                                <p>Separate multiple email addresses with commas</p>
                                <div>
                                    <input class="slds-input fixed-width-input" data-id="Email" id="emailAddresses" aria-label="Email(s) Required, Separate multiple email addresses with commas."
                            value={Email} onchange={handleNumChange} onkeyup={handleNumChange} type="email" data-index="0" />
                                    <template if:true={showErrorMessage}>
                                        <div class="slds-text-color_error" style="padding-top: 5px;" role="alert">
                                            {errorMessage}</div>
                                    </template>
                                </div>
                                <div class="slds-assistive-text">Separate multiple email addresses with commas</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="slds-modal__footer">
                    <button tabindex="0" class="slds-button siop-modal-button aria-disabled-button" onclick={handleGo} aria-disabled={inputsCheck} onfocusout={focusOutClose}>Send Invoice</button>
                </div>
            </div>
        </div>
    </template>
</template>
