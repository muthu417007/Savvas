<template>
  <lightning-quick-action-panel header="Clone Quote">
    -- Fill
    <lightning-record-edit-form
      object-api-name={objectApiName}
      onsuccess={handleSuccess}
      onsubmit={handleSubmit}
    >
      <lightning-messages> </lightning-messages>
      <lightning-input-field required field-name="Name" value={name}>
      </lightning-input-field>
      <lightning-input-field
        required
        field-name="CPQOpportunityId__c"
      ></lightning-input-field>
      
      <lightning-button
        class="slds-m-top_small"
        type="submit"
        label="Create new"
      >
      </lightning-button>
    </lightning-record-edit-form>
  </lightning-quick-action-panel>
</template>
