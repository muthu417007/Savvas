<template>
  <template if:true={openModal}>
      <div class="backdrop"></div>
      <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_large slds-align_absolute-left">
          <div class="slds-modal__container">
              <header class="slds-modal__header">
                  <h2 id="modal-heading-02" class="slds-text-heading_medium slds-hyphenate">Check Access Code</h2>
                  <button class="slds-button slds-button_icon slds-modal__close register-modal-close" onclick={closeModal} onfocusout={focusOutClose}>
                      <lightning-icon icon-name="utility:close" alternative-text="Close"></lightning-icon>
                  </button>
              </header>
              <div class="slds-modal__content">
                  <div class="slds-form_horizontal" style="width:95%">
                      <template if:true={showValidAccessCodeMsg}>
                          <div class="slds-align_absolute-center slds-text-color_success valid-access-code-errormsg" role="alert">{sccLabel} </div>
                      </template>
                      <template if:true={showInValidAccessCodeMsg}>
                          <div class="slds-align_absolute-center slds-text-color_error invalid-access-code-errormsg" role="alert">{sccLabel}</div>
                      </template>
                      <div>
                          <div class="accessCodeLabel">Access Code *</div>
                          <input value={accessCode} onchange={handleAccessCodeChange} onkeyup={handleAccessCodeChange} class="fixed-width-input access-code-input" placeholder="Access Code" data-index="0" aria-label="Access code Required Example CCFSC-ADKEE-THOLE-PCON-BACCY-CURSE"></input>
                      </div>
                  </div>
                  <div class="accessCodeExample">Example CCFSC-ADKEE-THOLE-PCON-BACCY-CURSE</div>
                  <button type="text" class={checkButtonCSS} onclick={checkAccessCodeResponse} aria-disabled={isCheckAccessCodeDisabled} onfocusout={focusOutButton}>Check Access Code</button>
              </div>
          </div>
      </section>
  </template>
</template>
