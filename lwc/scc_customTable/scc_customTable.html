<template>
	<div class="slds-grid slds-grid_vertical">
		<p>{addSelectedToCart}</p>
		<template if:true={isDataLoaded}>
			<div class="slds-grid slds-wrap">
				<div class="slds-col">
					<div class="slds-form-element__control slds-m-top_medium">
						<button class="slds-button table-control-button" disabled={bDisableFirst} onclick={firstPage}>&#60;&#60;&nbsp;&nbsp;First</button>
						<button class="slds-button table-control-button" disabled={bDisableFirst} onclick={previousPage}>&#60;&nbsp;&nbsp;Previous</button>
						<p class="page-count-shown slds-m-horizontal_x-small" role="alert">Showing {pageNumber} of {totalPages} Pages
						</p>
						<button class="slds-button table-control-button" disabled={bDisableLast} onclick={nextPage}>Next&nbsp;&nbsp;&#62;</button>
						<button class="slds-button table-control-button" disabled={bDisableLast} onclick={lastPage}>Last&nbsp;&nbsp;&#62;&#62;</button>
					</div>
				</div>
			</div>
		</template>
		<div class="slds-grid slds-wrap">
			<div class="slds-col slds-size_3-of-3">
				<table class="slds-table slds-table_bordered slds-table_fixed-layout slds-p-vertical_medium" role="grid"
					aria-label="search results">
					<thead>
						<tr class="slds-line-height_reset">
							<th aria-sort="ascending"
								class="slds-is-sortable slds-is-sorted slds-is-sorted_asc slds-cell_action-mode"
								scope="col">
								<a class="slds-th__action slds-text-link_reset" tabindex="0">
									<div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
										<span>QTY</span>
									</div>
								</a>
							</th>
							<th aria-sort="ascending"
								class="slds-is-sortable slds-is-sorted slds-is-sorted_asc slds-cell_action-mode"
								scope="col" style="width: 13%;">
								<a class="slds-th__action slds-text-link_reset" tabindex="0">
									<div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
										<span>ISBN</span>
									</div>
								</a>
							</th>
							<th aria-sort="none" class="slds-is-sortable slds-cell_action-mode" scope="col"
								style="width: 34%;">
								<a class="slds-th__action slds-text-link_reset" tabindex="0">
									<div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
										<span>Title Description</span>
									</div>
								</a>
							</th>
							<th aria-sort="none" class="slds-is-sortable slds-cell_action-mode" scope="col"
								style="width: 14%;">
								<a class="slds-th__action slds-text-link_reset" tabindex="0">
									<div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
										<span>Type</span>
									</div>
								</a>
							</th>
							<th aria-sort="none" class="slds-is-sortable slds-cell_action-mode" scope="col"
								style="width: 7%;">
								<a class="slds-th__action slds-text-link_reset" tabindex="0">
									<div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
										<span>Level</span>
									</div>
								</a>
							</th>
							<th aria-sort="none" class="slds-is-sortable slds-cell_action-mode" scope="col"
								style="width: 6%;">
								<a class="slds-th__action slds-text-link_reset" tabindex="0">
									<div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
										<span>&#169;</span>
									</div>
								</a>
							</th>
							<th aria-sort="none" class="slds-is-sortable slds-cell_action-mode" scope="col">
								<a class="slds-th__action slds-text-link_reset" tabindex="0">
									<div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
										<span>Status</span>
									</div>
								</a>
							</th>
							<th aria-sort="none" class="slds-is-sortable slds-cell_action-mode" scope="col"
								style="width: 7%;">
								<a class="slds-th__action slds-text-link_reset" tabindex="0">
									<div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
										<span>Price</span>
									</div>
								</a>
							</th>
						</tr>
					</thead>
					<tbody>
						<!-- value={product.quantity} -->
						<template for:each={transformedChildTableData1} for:item="product">
							<tr key={product.productDetails.Id}>
								<template if:true={isQuantityDisabled}>
									<td data-label="Quantity">
										<input type="number" data-row-id={product.productDetails.productId}
														data-attribute-name={product.productDetails.ISBN}
														data-attribute-price={product.productDetails.Price}
														 onchange={tableRowAction} value={product.quantity}
														oninput={tableRowAction} onfocus = {handleFocus}
														 data-field-name="quantityCount" id="quantity" name="quantity" min="0"
														  disabled={isQuantityDisabled} class="slds-input slds-m-left_small quantity-field"
														>
									</td>
									<td data-label="ISBN">
										<button class="slds-button slds-p-around_small" data-field-name="isbnId"
											data-row-id={product.productDetails.productId} disabled={isQuantityDisabled}
											onclick={tableRowAction}>{product.productDetails.ISBN}</button>
									</td>
								</template>
								<template if:false={isQuantityDisabled}>
									<td data-label="Quantity">
										<input type="number" data-row-id={product.productDetails.productId}
										data-attribute-name={product.productDetails.ISBN}
										data-attribute-price={product.productDetails.Price}
										onchange={tableRowAction}
										oninput={tableRowAction} onfocus = {handleFocus} value={product.quantity}
										data-field-name="quantityCount" id="quantity1" name="quantity"  max="" min="0"
										disabled={product.makedisable} class="slds-input slds-m-left_small quantity-field">

										<template if:true={product.makedisable}>
											<div class="slds-is-relative slds-show_inline-block slds-m-left_xx-small"
												style="margin-top: auto; margin-bottom: auto; bottom: 5px;">
											
												<span class="slds-icon_container slds-icon-utility-lock lock-icon">
													<svg width="11" height="14" viewBox="0 0 11 14" fill="none" xmlns="http://www.w3.org/2000/svg">
														<path opacity="0.5" fill-rule="evenodd" clip-rule="evenodd"
															d="M1.37647 5.44444V4.04444C1.37647 1.81082 3.15686 0 5.35294 0C7.54902 0 9.32941 1.81082 9.32941 4.04444V5.44444H9.63529C10.2267 5.44444 10.7059 5.93177 10.7059 6.53333V12.9111C10.7059 13.5127 10.2267 14 9.63529 14H1.07059C0.479134 14 0 13.5127 0 12.9111V6.53333C0 5.93177 0.479134 5.44444 1.07059 5.44444H1.37647ZM3.21177 4.04444C3.21177 2.84192 4.17063 1.86667 5.35294 1.86667C6.53525 1.86667 7.49412 2.84192 7.49412 4.04444V5.44444H3.21177V4.04444ZM5.88824 9.5242C6.16425 9.34495 6.34706 9.03019 6.34706 8.67228C6.34706 8.11387 5.90197 7.66117 5.35294 7.66117C4.80391 7.66117 4.35882 8.11387 4.35882 8.67228C4.35882 9.03019 4.54163 9.34494 4.81765 9.5242V11.2389C4.81765 11.5397 5.05721 11.7833 5.35294 11.7833C5.64867 11.7833 5.88824 11.5397 5.88824 11.2389V9.5242Z"
															fill="#0C1E3D" />
													</svg>
											
												</span>
												<div class="slds-popover slds-popover_tooltip slds-nubbin_bottom-left filter-popup" role="tooltip" id="1000">
													<div class="slds-popover__body schldistrict" style=" white-space: normal !important;">
														{product.restrictionMessage}</div>
												</div>
											</div>
										</template>
									</td>
									<td data-label="ISBN">
										<button class="slds-button slds-p-around_small" data-field-name="isbnId"
											data-row-id={product.productDetails.productId} disabled={product.makedisable}
											onclick={tableRowAction}>{product.productDetails.ISBN}</button>
									</td>
								</template>
								<!-- <td data-label="ISBN">
									<button class="slds-button slds-p-around_small" data-field-name="isbnId" data-row-id={product.productDetails.productId} disabled={product.makedisable}
									onclick={tableRowAction}>{product.productDetails.ISBN}</button>

								</td> -->
								<td data-label="Title Description">
									<div>{product.productDetails.Title_Description}</div>
								</td>
								<td data-label="Type" style="word-break: break-all;">
									<div>{product.productDetails.Type}</div>
								</td>
								<td data-label="Grade Level">
									<div class="slds-text-align_center">{product.productDetails.Grade_Level}</div>
								</td>
								<td data-label="Copyright">
									<div>{product.productDetails.Copyright}</div>
								</td>
								<td data-label="Status">
									<div>{product.productDetails.Status}</div>
								</td>
								<template if:false={priceLoaded}>
									<td data-label="Price">
										<div class="loader slds-text-align_center"></div>
									</td>
								</template>
								<template if:true={priceLoaded}>
									<td data-label="Price">
										<div class="slds-text-align_center">${product.productDetails.Price}</div>
									</td>
								</template>
							</tr>
						</template>
					</tbody>
				</table>
			</div>
		</div>
	</div>
	<template if:true={callAddItemToCart}>
		<c-scc_add-items-to-cart  message={itemsList} onreveiewcartcount={handleReviewCartCount}
		userselection={userInputs} check-active-cart-id={activeCartId} onresetaddtocart={handleresetaddtocart}>
	</c-scc_add-items-to-cart>
	</template>
	<template if:true={reviewCartPage}>
		<c-scc_review-cart-page> </c-scc_review-cart-page>
	</template>
	<template if:true={clearCartItems}>
		<c-scc_delete-items-from-cart onrefreshevent={handlerefreshevent}> </c-scc_delete-items-from-cart>
	</template>

	<!--Start warning message when qty > 1000   -->
	<template if:true={showWarningMessage}>
		<!-- Modal/Popup Box LWC starts here -->
		<div class="slds-modal slds-fade-in-open slds-backdrop" role="dialog">
			<div class="slds-modal__container">
				<!-- HEADER Section -->
				<div class="slds-modal__header">
					<button class="slds-modal__close closebtnOnFocus" onclick={closeCartModal}  onfocusout={focusOutClose} aria-label="close" data-id="closeButton">x</button>

					<h2>Quantity Exceeds 1000</h2>
				</div>
				<!-- Body Section -->
				<div class="slds-modal__content slds-p-horizontal_xx-large slds-p-top_large">
					<div class="slds-form_horizontal" style="width: 100%;">
						<p style="text-align: left;">Note that at least one line has a quantity greater than 1000. <br/>
						   If you would like to correct the entry, select Cancel and update the quantity in the ISBN(s) & Desired Quantity field, or select Ok to proceed.
						</p>
					</div>
				</div>
				<!--Footer -->
				<div class="slds-modal__footer">
					<button class="slds-button ok-modal-button" onclick={handleQuantity} data-index="0">Ok</button>
					<button tabindex="0" class="slds-button cancel-modal-button" onclick={handleCancelBtn} onfocusout={focusOutButton}>Cancel</button>

				</div>
			</div>
		</div>
	</template>

	<template if:true={showConfirmationModal}>
    <section class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
        <div class="slds-modal__container">
            <!-- Header Section -->
            <div class="slds-modal__header">
                <button class="slds-modal__close closebtnOnFocus" aria-label="close" onclick={handleCancelAddToCart}>x</button>
                <h2 class="slds-text-heading_medium">Confirm Your Selection</h2>
            </div>

            <!-- Body Section -->
            <div class="slds-modal__content slds-p-horizontal_xx-large slds-p-top_large" role="document">
                <p>You have selected a state specific product that does not match your billing or shipping addresses.
                	Are you sure that you want to proceed?</p>
            </div>

            <!-- Footer Section -->
            <div class="slds-modal__footer">
                <button class="slds-button clear-cart-modal-button" onclick={handleConfirmAddToCart}>I’m Sure</button>
                <button class="slds-button cancel-modal-button" onclick={handleCancelAddToCart}>No, look at my selection again</button>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>

	<!--End  -->


</template>
