<template>
	<div class="Forgot-pswd-container" role="region" aria-label="Forgot Password">
		<div class="Forgot-pswd-without-footer">
			<div class="title" role="heading" aria-level="1">Forgot Password</div>
			<div class="forgotpwd">
				<p>To reset your password we'll need your username. We'll send password reset instructions to the email
					address associated with your account.</p>
				</br>
				<div style="position:relative" tabindex="-1">Please Note: These &nbsp;
					<a href="#" onfocus={showToolTip} onblur={HideToolTip} onmouseover={showToolTip}
						onmouseout={HideToolTip} style="text-decoration:underline;	color: blue;"
						aria-label="applications list of items my savvas support, my savvas orders, virtual sampling, siop registration, worktext subscription, dealer and distributor license allocation use the same usernames and password">applications</a>
					<template if:true={isShowToolTip}>
						<div class="slds-popover slds-nubbin_left-top" role="tooltip" id="help">
							<div class="slds-popover__body">
								<ul class="slds-list_dotted">
									<lightning-formatted-rich-text value={labels.scc_savvas_application_list}>
									</lightning-formatted-rich-text>
								</ul>
							</div>
						</div>
					</template>
					&nbsp; use the same usernames and password.
				</div>
				</br>
				<p>When you change the password for this application, you are changing the passwords for all
					applications [to which you have access].</p>
			</div>
			<label class="email-label" for="Email">Email</label>
			<input class="slds-input email-input" type="text" id="Email" name="Email" label="Email"
				placeholder="Username" onchange={handleInput} value={emailValue} />
			<template if:true={invalid_message}>
				<div class="invalid-message" role="alert">Invalid Email Address</div>
			</template>
			<button class="slds-button submit-button" onclick={submitHandler}>Reset Password</button>
			<div class="cancel-button" onclick={submitHandler}><a href={labels.scc_my_savvas_orders_login_url}
					target="_self" role="button">Cancel</a></div>
		</div>
		<div class="slds-grid slds-grid_vertical">
			<div class="slds-col signin-blue-footer">
				<div class="signin-footer-copyright-text">{labels.scc_signIn_Footer_Text}</div>
				<div style="gap:12px">
					<a href="#" class="signin-footer-links">{labels.scc_signIn_Footer_Savvas_Support}</a>
					<a href="#" class="signin-footer-links"
						style="margin-left: 11px; margin-right: 11px;">{labels.scc_signIn_Footer_Terms_Text}</a>
					<a href="#" class="signin-footer-links">{labels.scc_signIn_Footer_Privacy_Text}</a>
				</div>
			</div>
		</div>
	</div>
</template>
