<template>
	<template if:true={checkOutPage}>
		<div class="slds-p-vertical_medium slds-p-horizontal_x-large mobile-container">
			<div class="slds-grid slds-wrap slds-p-bottom_medium">
				<template if:false={isGuest}>
					<div class="slds-col slds-size_12-of-12 slds-float_left">
						<nav role="navigation" aria-label="Breadcrumbs">
							<ol class="slds-breadcrumb slds-list_horizontal slds-wrap">
								<li class="slds-breadcrumb__item">
									<a href="#" class="slds-m-right_small breadcrumb-label">Home</a>
								</li>
								<li class="slds-breadcrumb__item">
									<a href="#" class="slds-m-horizontal_small breadcrumb-label">Place Order</a>
								</li>
								<li class="slds-breadcrumb__item">
									<a href="#" class="slds-m-horizontal_small breadcrumb-label">Product Search</a>
								</li>
								<li class="slds-breadcrumb__item">
									<a href="#" class="slds-m-horizontal_small breadcrumb-label">Review Cart</a>
								</li>
								<li class="slds-breadcrumb__item">
									<a class="slds-m-left_small slds-text-title_bold breadcrumb-label">Checkout</a>
								</li>
							</ol>
						</nav>
					</div>
					<div class="slds-col slds-size_12-of-12 top-buttons">
						<button class="Cart-button1" onclick={closeShowDeliveryDetails} >Return to Cart</button>
						<button class="Cart-button2" onclick={handleReviewOrder} aria-disabled={isReviewOrdrDisabled1}>
						<img class="slds-m-right_xx-small cart-blue" src={labels.scc_checkout_cart} alt="cart icon" />
						<img class="slds-m-right_xx-small cart-white" src={labels.scc_checkout_cart_white} alt="cart icon" />
						Review Order
					</button>
					</div>
				</template>
				<template if:true={isGuest}>
					<div class="slds-col slds-size_12-of-12 slds-float_left">
						<nav role="navigation" aria-label="Breadcrumbs">
							<ol class="slds-breadcrumb slds-list_horizontal slds-wrap">
								<li class="slds-breadcrumb__item">
									<a class="slds-m-left_small slds-text-title_bold breadcrumb-label">Checkout</a>
								</li>
							</ol>
						</nav>
					</div>
					<div class="slds-col slds-size_12-of-12 top-buttons">
						<button class="Cart-button2" onclick={handleReviewOrder} aria-disabled={isGuestReviewOrdrDisabled}>
						<img class="slds-m-right_xx-small cart-blue" src={labels.scc_checkout_cart} alt="cart icon" />
						<img class="slds-m-right_xx-small cart-white" src={labels.scc_checkout_cart_white} alt="cart icon" />
						Review Order
					</button>
					</div>
				</template>
			</div>

			<div class="CheckOut">
				<div class="slds-grid">
					<div class="slds-col slds-size_8-of-12 slds-p-vertical_large slds-p-left_large scroll-bar">
						<h2 class="Checkout-title">{labels.scc_checkOut_ContactInfo_Text}</h2>
						<div class="slds-grid slds-gutters">
							<div class="slds-col slds-size_5-of-12">
								<div class="slds-form-element__label">{labels.scc_register_FirstName_Text}</div>
								<input placeholder="First Name" type="text" onkeyup={handleReviewOrderData} onchange={handleReviewOrderData} name="FirstName" value={firstName} class="fixed-width-input slds-input"
								aria-label="First Name Required"/>
							</div>
							<div class="slds-col slds-size_5-of-12 lastname-container">
								<div class="slds-form-element__label">{labels.scc_register_LastName_Text}</div>
								<input placeholder="Last Name" type="text" onkeyup={handleReviewOrderData} onchange={handleReviewOrderData} class="fixed-width-input slds-input" name="LastName" value={lastName}
								aria-label="Last Name Required"/>
							</div>
						</div>
						<div class="slds-grid slds-gutters">
							<!-- <div class="slds-col-slds-size_2-of-12">
							<div class="slds-form-element__label">{labels.scc_checkOut_Phone_Text}</div>
							<input placeholder="555-555-5555" type="phone" oninput={handlePhoneNumberInput} class="fixed-width-input slds-input" name="Phone" value={phone}/>
						</div> -->
							<div class="slds-col slds-size_5-of-12">
								<div class="slds-form-element__label">{labels.scc_checkOut_Order_Email_Text}*</div>
								<input placeholder="user@domain.com" type="email" onkeyup={handleReviewOrderData} onchange={handleReviewOrderData} class="fixed-width-input slds-input" name="OrderConfirmationEmail" value={email}
								aria-label="Order Confirmation Email Required"/>
							</div>
							<div class="slds-col slds-size_5-of-12 lastname-container">
								<div class="slds-form-element__label">{labels.scc_checkOut_Shipment_mail_Text}
								</div>
								<input placeholder="user@domain.com" type="email" onkeyup={handleReviewOrderData} onchange={handleReviewOrderData}  class="fixed-width-input slds-input" name="ShipmentConfirmationEmail" value={ship_email}
								aria-label="Shipment Confirmation Email"/>
							</div>
						</div>
						<div class="slds-grid slds-gutters">
							<!-- <div class="slds-col-slds-size_2-of-12">
							<div class="slds-form-element__label">{labels.scc_checkOut_Shipment_mail_Text}</div>
							<input placeholder="user@domain.com" type="email" onkeyup={handleReviewOrderData} onchange={handleReviewOrderData}  class="fixed-width-input slds-input" name="ShipmentConfirmationEmail" value={ship_email}/>
						</div> -->
							<div class="slds-col slds-size_5-of-12">
								<div class="slds-form-element__label">{labels.scc_checkOut_Phone_Text}</div>
								<input placeholder="555-555-5555" type="text" maxlength="12" oninput={handlePhoneNumberInput} class="fixed-width-input slds-input" name="Phone" value={testPhone}
								aria-label="Phone Required"/>
							</div>
						</div>
						<div>
							<h2 class="Checkout-title">{labels.scc_checkOut_OrderInfo_Text}</h2>
							<div class="slds-grid slds-gutters">
								<div class="slds-col slds-size_5-of-12">
									<div class="slds-is-relative">
										<div class="cancel-back-order-text">
											{labels.scc_Cancel_Back_Order_Text} <a
												href="https://support.savvas.com/">support.savvas.com</a>
											<!-- <lightning-helptext class="help-text"
																content={labels.scc_checkOut_Back_Order_HelpText}>
															</lightning-helptext> -->
											<!--<div class="slds-is-relative slds-show_inline-block slds-m-left_xx-small">
																<div class="slds-show_inline-block info-icon slds-m-right_xx-small slds-text-align_center">i</div>
																<div class="slds-popover slds-popover_tooltip slds-nubbin_bottom backorder-popover" role="tooltip">
																	<div class="slds-popover__body">Date on which any Backordered line items will be automatically cancelled from your order.</div>
																</div>
															</div>-->
										</div>
										<!--<input placeholder="01/01/2024" type="Date" onkeyup={handleReviewOrderData} onchange={handleReviewOrderData} class="fixed-width-input slds-input" name="CancelBackOrderDate" value={CancelBackOrderDate}/>
														<img class="calender-icon" alt="calender icon" src={labels.scc_calender_icon} />-->
									</div>
								</div>
								<div class="slds-col slds-size_5-of-12 lastname-container">
									<div class="slds-is-relative">
										<div class="slds-form-element__label">
											{labels.scc_checkOut_Requested_Ship_Text}
											<!-- <lightning-helptext class="help-text"
																	content={labels.scc_checkout_ShipDate_HelpText}>
																</lightning-helptext> -->
											<div class="slds-is-relative slds-show_inline-block slds-m-left_xx-small">
												<div
													class="slds-show_inline-block info-icon slds-m-right_xx-small slds-text-align_center">
													i</div>
												<div class="slds-popover slds-popover_tooltip slds-nubbin_bottom"
													role="tooltip">
													<div class="slds-popover__body">Your order will ship from the
														warehouse on or after this date - please allow 7-10 days for
														delivery</div>
												</div>
											</div>
										</div>
										<input placeholder="04/01/2024" type="Date" max="9999-12-31" onkeyup={handleReviewOrderData} onchange={handleReviewOrderData} class="fixed-width-input slds-input" name="RequestedShipDate" value={RequestedShipDate}
										aria-label="Requested Ship Date, Your order will ship from the warehouse on or after this date- please allow 7-10 days for delivery."/>
										<img class="calender-icon" alt="calender icon" src={labels.scc_calender_icon} />
									</div>
								</div>
							</div>

							<div class="slds-grid slds-gutters">
								<div class="slds-col slds-size_5-of-12">
									<div class="slds-form-element__label">
										{labels.scc_checkOut_PromoCode_Text}</div>
									<div class="input-wrapper">
										<input type="text" data-id="promoinput" class="fixed-width-input slds-input" name={PromoCode} value={promoCodeValue} oninput={handleChange} aria-label="Promo Code"/>
										<button class="apply-btn" onclick={handleApplyClick}>Apply</button>
									</div>
								</div>
							</div>
							<div>
								<h2 class="Checkout-title">
									{labels.scc_checkOut_BillingInfo_Text}</h2>
								<div class="slds-grid slds-gutters">
									<template if:false={isGuest}>
										<div class="slds-col slds-size_5-of-12">
											<div class="slds-form-element__label">
												{labels.scc_checkOut_BillTo_Text}</div>
											<input placeholder="Type Here" type="Text" onkeyup={handleReviewOrderData} onchange={handleReviewOrderData} class="fixed-width-input slds-input" name="BillToAttention" value={BillToAttention} aria-label="Bill to Attention"/>
										</div>
									</template>
									<div class="slds-col slds-size_10-of-12">
										<template if:true={isGuest}>
											<lightning-input type="checkbox" label="Use Ship To Address As Bill To"
												onchange={handlebillAddressCheckbox} checked={isBillAddressSame}>
											</lightning-input>
											<template if:false={isBillAddressSame}>
												<lightning-input class="bill-address-details"
													label={labels.scc_Checkout_Name} value={billName}
													onchange={handleBillAddressChange} name="billName"
													placeholder="Type here">
												</lightning-input>
												<lightning-input class="bill-address-details"
													label={labels.scc_Checkout_Street} value={billStreet}
													onchange={handleBillAddressChange} name="billStreet"
													placeholder="Type here">
												</lightning-input>
												<div class="slds-grid slds-gutters">
													<div class="slds-col slds-size_1-of-2">
														<lightning-input label={labels.scc_Checkout_Floor}
															value={billFloor} onchange={handleBillAddressChange}
															name="billFloor" placeholder="Type here">
														</lightning-input>
													</div>
													<div class="slds-col slds-size_1-of-2">
														<lightning-input label={labels.scc_Checkout_City}
															value={billCity} onchange={handleBillAddressChange}
															name="billCity" placeholder="Type here">
														</lightning-input>
													</div>
												</div>
												<div class="slds-grid slds-gutters">
													<div class="slds-col slds-size_1-of-2">
														<lightning-combobox class="statuscombobox slds-p-top_medium"
															label={labels.scc_Checkout_State} value={billState}
															options={billStateOptions}
															onchange={handleBillAddressChange}>
														</lightning-combobox>
													</div>
													<div class="slds-col slds-size_1-of-2">
														<lightning-input class="addressZip1"
															label={labels.scc_Checkout_Zip} value={billZip}
															placeholder={labels.scc_ZipHelpText}
															onchange={handleBillAddressChange} name="billZip">
														</lightning-input>
													</div>
												</div>
												<lightning-combobox class="statuscombobox bill-address-details"
													label={labels.scc_Checkout_Country} value={billCountry}
													options={billCountryOptions}
													onchange={handleBillCountryOptionChange}>
												</lightning-combobox>
											</template>
										</template>
									</div>
								</div>
								<div class="payment-method-container">
									<h2 class="slds-m-bottom_small payment-title">Payment Method
									</h2>
									<template if:true={showErrorMessage}>
										<div class="slds-text-color_error slds-m-bottom_small" role="alert">
											{errorMessage}</div>
									</template>
									<div class="slds-col slds-size_1-of-2 payment-method">
										<div class="slds-form-element radio-labels">
											<div class="slds-show_inline-block slds-m-right_medium">
												<input class="payment-option-radio payment-options slds-m-right_xx-small" type="radio" name ="paymentMethods" value="creditCard" checked={isCreditCardSelected} onchange={handlePaymentChange} aria-label="Payment Method, Pay with Credit Card.">
												<div class="slds-show_inline-block slds-m-right_small">
													{labels.scc_Credit_Card}</div>
												<template if:false={isGuest}>
													<input class="payment-option-radio slds-m-left_large slds-m-right_xx-small" type="radio" name ="paymentMethods" value="poMethod" checked={isPoSelected} onchange={handlePaymentChange} aria-label="Pay Via Purchase order">
													<div class="slds-show_inline-block">{labels.scc_Checkout_PO}</div>
												</template>
											</div>
										</div>
									</div>
									<template if:true={isCreditCardSelected}>
										<template if:true={displayiFrame}>
											<div class="credit-card-details slds-p-around_large">
												<div id="iframewrapper">
													<iframe id="paymetric-iframe" class="payment-metric-iframe"
														src={iFrameUrl} name="dieCommFrame" onload={IFrame_OnLoad}>
													</iframe>
												</div>
												<lightning-input type="checkbox" label={labels.scc_CreditCardAddress}
													onchange={handleCardAddressCheckbox} checked={isAddressDifferent} >
												</lightning-input>
												<template if:true={isAddressDifferent}>
													<lightning-input class="card-address-details-container"
														label={labels.scc_Checkout_Name} value={cardName}
														onchange={handleCardAddressChange} name="cardName" aria-label="Name Required" >
													</lightning-input>
													<lightning-input class="card-address-details-container"
														label={labels.scc_Checkout_Street} value={cardStreet}
														onchange={handleCardAddressChange} name="cardStreet" aria-label="Street (No PO Boxes) Required">
													</lightning-input>
													<div class="slds-grid slds-gutters">
														<div class="slds-col slds-size_1-of-2">
															<lightning-input label={labels.scc_Checkout_Floor}
																value={cardFloor} onchange={handleCardAddressChange}
																name="cardFloor">
															</lightning-input>
														</div>
														<div class="slds-col slds-size_1-of-2">
															<lightning-input label={labels.scc_Checkout_City}
																value={cardCity} onchange={handleCardAddressChange}
																name="cardCity" aria-label="City Required">
															</lightning-input>
														</div>
													</div>
													<div class="slds-grid slds-gutters">
														<div class="slds-col slds-size_1-of-2">
															<lightning-combobox class="statuscombobox"
																label={labels.scc_Checkout_State} value={cardState}
																options={cardStateOptions}
																onchange={handleCardAddressChange} aria-label="State / Province Required">
															</lightning-combobox>
														</div>
														<div class="slds-col slds-size_1-of-2">
															<lightning-input class="addressZip2"
																label={labels.scc_Checkout_Zip} value={cardZip}
																placeholder={labels.scc_ZipHelpText}
																onchange={handleCardAddressChange} name="cardZip" aria-label="Zip / Postal Code Required">
															</lightning-input>
														</div>
													</div>
													<lightning-combobox
														class="statuscombobox card-address-details-container"
														label={labels.scc_Checkout_Country} value={cardCountry}
														options={cardCountryOptions}
														onchange={handleCardCountryOptionChange} aria-label="Country Required">
													</lightning-combobox>
												</template>
											</div>
										</template>
									</template>
									<template if:false={isGuest}>
										<template if:true={isPoSelected}>
											<div
												class="slds-grid slds-p-around_large credit-card-details credit-card-details-po">
												<div class="slds-col slds-size_12-of-12">
													<div class="slds-form-element__label">
														{labels.scc_Checkout_PONumber}
														<!-- <lightning-helptext class="help-text"
																					content={labels.scc_PO_Info_Text}>
																				</lightning-helptext> -->
														<div class="slds-is-relative slds-show_inline-block">
															<div
																class="slds-show_inline-block info-icon slds-text-align_center">
																i</div>
															<div class="slds-popover slds-popover_tooltip slds-nubbin_bottom"
																role="tooltip" id="45">
																<div class="slds-popover__body">
																	{labels.scc_PO_Info_Text}</div>
															</div>
														</div>
													</div>
													<input placeholder="PO #" type="Text" onkeyup={handleReviewOrderData} onchange={handlePOChange} class="slds-input" value={poNumber}
													aria-label="PO# Required, If your institution does not provide a PO#,enter your last name."/>
												</div>
											</div>
										</template>
									</template>
								</div>

								<div>
									<h2 class="Checkout-title">
										{labels.scc_checkOut_ShippingInfo_Text}</h2>
									<div class="slds-grid slds-wrap slds-gutters">
										<div class="slds-col slds-size_5-of-12">
											<div class="slds-form-element__label">
												{labels.scc_checkOut_ShipTo_Attention_Text}
												<!-- <lightning-helptext class="help-text"
																			content={labels.scc_checkOut_ShipTo_Attention_HelpText}>
																		</lightning-helptext> -->
												<div
													class="slds-is-relative slds-show_inline-block slds-m-left_xx-small ship-to-attention-tooltip">
													<div
														class="slds-show_inline-block info-icon slds-m-right_xx-small slds-text-align_center">
														i</div>
													<div class="slds-popover slds-popover_tooltip slds-nubbin_bottom"
														role="tooltip" id="44">
														<div class="slds-popover__body">
															{labels.scc_checkOut_ShipTo_Attention_HelpText}</div>
													</div>
												</div>
											</div>
											<input placeholder="Type Here" type="Address" onkeyup={handleReviewOrderData} onchange={handleReviewOrderData} class="fixed-width-input slds-input" name="ShipToAttention" value={ShipToAttention} 
											aria-label="Ship To Attention, Add Contact Name, Department,Room ID,etc to selected Ship-To."/>
										</div>
										<div class="slds-col slds-size_10-of-12">
											<template if:true={isGuest}>
												<template if:true={displayInstitution}>
													<template if:true={showInstitutionName}>
														<div class="slds-form-element__label">
															{labels.scc_Institution_Name}
															<div class="slds-form-element__label">
																{institutionName}
															</div>
														</div>
													</template>
													<lightning-combobox
														class="statuscombobox slds-p-top_medium institution-details"
														label={labels.scc_Institution_Type} value={institutionType}
														options={institutionTypeOptions}
														onchange={handleShipAddressChange}>
													</lightning-combobox>
													<lightning-combobox
														class="statuscombobox slds-p-top_medium institution-details"
														label={labels.scc_Instution_Iam} value={iAm}
														options={iAmOptions} onchange={handleShipAddressChange}>
													</lightning-combobox>
												</template>
												<lightning-input class="ship-address-details"
													label={labels.scc_Checkout_Name} value={shipName}
													onchange={handleShipAddressChange} name="shipName"
													placeholder="Type here">
												</lightning-input>
												<lightning-input class="ship-address-details"
													label={labels.scc_Checkout_Street} value={shipStreet}
													onchange={handleShipAddressChange} name="shipStreet"
													placeholder="Type here">
												</lightning-input>
												<div class="slds-grid slds-gutters">
													<div class="slds-col slds-size_1-of-2">
														<lightning-input label={labels.scc_Checkout_Floor}
															value={shipFloor} onchange={handleShipAddressChange}
															name="shipFloor" placeholder="Type here">
														</lightning-input>
													</div>
													<div class="slds-col slds-size_1-of-2">
														<lightning-input label={labels.scc_Checkout_City}
															value={shipCity} onchange={handleShipAddressChange}
															name="shipCity" placeholder="Type here">
														</lightning-input>
													</div>
												</div>
												<div class="slds-grid slds-gutters">
													<div class="slds-col slds-size_1-of-2">
														<lightning-combobox class="statuscombobox slds-p-top_medium"
															label={labels.scc_Checkout_State} value={shipState}
															options={shipStateOptions}
															onchange={handleShipAddressChange}>
														</lightning-combobox>
													</div>
													<div class="slds-col slds-size_1-of-2">
														<lightning-input class="addressZip"
															label={labels.scc_Checkout_Zip} value={shipZip}
															placeholder={labels.scc_ZipHelpText}
															onchange={handleShipAddressChange} name="shipZip">
														</lightning-input>
													</div>
												</div>
												<lightning-combobox class="statuscombobox ship-address-details"
													label={labels.scc_Checkout_Country} value={shipCountry}
													options={shipCountryOptions}
													onchange={handleShipCountryOptionChange} disabled={isShipDisabled}>
												</lightning-combobox>
											</template>
										</div>
									</div>
									<template if:false={isGuest}>

			<template if:true={openLicenseToModal}>
				<div class="slds-modal slds-fade-in-open slds-backdrop change-modal">
					<div class="slds-modal__container modal-page">
						<!------HEADER Section-->
						<div class="slds-modal__header modal-header">
							<div class="slds-p-horizontal_large change-modal-title">
								<button class="slds-modal__close closebtnOnFocus" onclick={closeLicenseToModal1} onfocusout={focusOutClose} aria-label="close" data-id="closeButton">x</button>
								<h2>Provision License To</h2>
							</div>
							<div class="slds-p-right_large slds-m-bottom_medium slds-float_right change-modal-filter">
								<label class="slds-form-element__label slds-p-right_none slds-m-left_x-small" for="filter-search-input1">Filter Results</label>
								<div class="slds-is-relative slds-show_inline-block slds-m-left_xx-small">
									<div
										class="slds-show_inline-block info-icon slds-m-right_xx-small slds-text-align_center">
										i</div>
									<div class="slds-popover slds-popover_tooltip slds-nubbin_bottom" role="tooltip">
										<div class="slds-popover__body">{labels.scc_checkOut_Filter_HelpText}</div>
									</div>
								</div>
								<div class="slds-is-relative">
									<input type="text" id="filter-search-input1" class="slds-input filter-search-input" value={searchTermShip} onchange={handleUserInputsShip} onkeyup={handleUserInputsShip} data-index="0" />
									<a href="#" class="slds-button filter-clear"  onclick={clearFilterInput} aria-label="close">x</a>
								</div>
								<div class="slds-form-element__label item-count" role="alert">{totalShipToRecords} of
									{totalShipToRecords} Items</div>
								<div class="slds-is-relative slds-show_inline-block">
									<div class="slds-show_inline-block info-icon slds-text-align_center">i</div>
									<div class="slds-popover slds-popover_tooltip slds-nubbin_bottom-right filter-popover"
										role="tooltip">
										<div class="slds-popover__body">{labels.scc_checkOut_Filter_HelpText}</div>
									</div>
								</div>
							</div>
						</div>
						<!------Body Section-->
						<div class="slds-modal__content slds-p-around_medium">
							<div class="slds-form_horizontal">
								<div class="slds-grid slds-gutters slds-wrap">
									<template for:each={filteredresultt} for:item="shippaddr">
										<div class="slds-col slds-size_4-of-12" key={shippaddr.AccShipId}>
											<div class="slds-visual-picker slds-visual-picker_medium">
												<input type="radio" id={shippaddr.AccShipId} value={shippaddr.AccShipId} name="shipping-address-license"  onclick={handleLicenseRowClick} data-record-id={shippaddr.AccShipId}
											data-address-name={shippaddr.SAccountName} data-address-city={shippaddr.ShippingCity} data-address-street={shippaddr.ShipStreet} data-address-provionce={shippaddr.Provionce}
											data-address-postal-code={shippaddr.PostalCode} data-address-country={shippaddr.ShippingCountry} data-index="0"/>
												<label for={shippaddr.AccShipId}>
																			<div class="card-size">
																				<span class="slds-visual-picker__figure slds-visual-picker__text card-size card-padding slds-p-around_medium">
																					<span>
																							{shippaddr.SAccountName} <br/> {shippaddr.ShipStreet} <br/>
																							{shippaddr.ShippingCity} {shippaddr.Provionce} {shippaddr.PostalCode}<br/>
																							{shippaddr.ShippingCountry}
																					</span>
																				</span>
																				<span class="slds-icon_container slds-visual-picker__text-check">
																					<svg class="slds-icon slds-icon-text-check slds-icon_x-small" aria-hidden="true">
																					</svg>
																				</span>
																			</div>
																		</label>
											</div>
										</div>
									</template>
								</div>
							</div>
						</div>
						<!------Footer Section-->
						<div class="slds-modal__footer">
							<button class="Cancel slds-m-right_medium"  onclick={closeLicenseToModal1} data-index="0">Cancel</button>
							<button tabindex="0" class="Change-Address" aria-disabled={isChangeAddDisabled} onclick={SaveLicenseMethod} type="submit" onfocusout={focusOutButton}>Change License to</button>
						</div>
					</div>
				</div>
			</template>
		</template>

		<!-- Replace Promo Code Pop-UP -->
		<template if:true={showPromoConfirmation}>
			<section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
				class="slds-modal slds-fade-in-open">
				<div class="slds-modal__container">
					<div class="slds-modal__header">
						<button class="slds-modal__close closebtnOnFocus" onclick={closePromoPopUp} onfocusout={focusOutClose} aria-label="close" data-id="closeButton">x</button>
						<h2>Replace Promo</h2>
						<!-- <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate"
														tabindex="-1">Replace Promo</h1>
													<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closePromoPopUp}> X </button> -->
					</div>
					<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
						<div class="slds-form_horizontal slds-text-align_center">
							<p>Only one promo code can be applied. Are you sure you would like to
								replace the existing promo code?</p>
						</div>
					</div>
					<div class="slds-modal__footer">
						<button class="slds-button slds-button_brand action-modal-button" onclick={updatePromoCode} data-index="0">Replace Promo</button>
						<button tabindex="0" class="slds-button slds-button_neutral cancel-modal-button" aria-label="Cancel and close" onclick={closePromoPopUp} onfocusout={focusOutButton}>Cancel</button>
					</div>
				</div>
			</section>
			<div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
		</template>
		<!-- Invalid Promo Code Pop-UP -->
		<template if:true={showInvalidPromo}>
			<section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-02"
				class="slds-modal slds-fade-in-open">
				<div class="slds-modal__container">
					<div class="slds-modal__header">
						<button class="slds-modal__close closebtnOnFocus" onclick={closeInvalidPromoPopUp} onfocusout={focusOutClose} aria-label="close" data-id="closeButton">x</button>
						<h2>Invalid Promo Code</h2>
						<!-- <h1 id="modal-heading-02" class="slds-modal__title slds-hyphenate"

													<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeInvalidPromoPopUp}> X </button> -->
					</div>
					<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2"
						style="text-align: centre;">
						<div class="slds-form_horizontal slds-text-align_center">
							<p>Invalid Promo Code, please check your entry.</p>
						</div>
					</div>
					<div class="slds-modal__footer">
						<button class="slds-button slds-button_brand cancel-modal-button Change-Address" onclick={closeInvalidPromoPopUp} onfocusout={focusOutButton}>Close</button>
					</div>
				</div>
			</section>
			<div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
		</template>
		<template if:true={showLoader}>
			<!-- <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner> -->
				<!-- <div class="spinner-wrapper slds-spinner_container" style="height: 200px; position:absolute;">
			<div class="slds-backdrop slds-backdrop_open">
				<lightning-spinner size="medium" variant="brand" alternative-text="Loading"></lightning-spinner>
			</div>
		</div> -->
		</template>


	</template>

	<template if:true={showReviewOrderDetails}>
		<c-scc_review-order-l-w-c order-id={activeOrderId} onclosecheckout={closeShowDeliveryDetails}

	</template>
